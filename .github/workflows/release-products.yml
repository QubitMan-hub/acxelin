name: release-products
# One release per product: push core-vX.Y.Z, tls-vX.Y.Z, vpn-vX.Y.Z or readiness-vX.Y.Z. Core goes first; tools/release_check.py refuses a
# product whose acxelin-core range has no released core in it.
on:
  push:
    tags: ["core-v*", "tls-v*", "vpn-v*", "readiness-v*"]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.tag.outputs.product }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - id: tag
        run: |
          pip install packaging
          python tools/release_check.py "$GITHUB_REF_NAME"
          echo "product=${GITHUB_REF_NAME%-v*}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME##*-v}" >> "$GITHUB_OUTPUT"
  build:
    needs: gate
    runs-on: ubuntu-latest
    container: python:3.13-slim-trixie@sha256:7c61056e61ac89e852de05f3dc6fa51a6dd2181797bceed46aa725dd7cb2cd3b
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      PRODUCT: ${{ needs.gate.outputs.product }}
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apt-get update && apt-get install -y --no-install-recommends git gh procps
      - name: Test what is being released
        run: |
          if [ "$PRODUCT" = core ]; then pip install ./core pytest && python -m pytest -q core/tests; else
            extra=$(python -c "import sys; sys.path.insert(0, 'tools'); from wheelhouse import EXTRAS; print(EXTRAS.get('$PRODUCT', '').strip('[]'))")
            pip install ./core "./products/$PRODUCT[test${extra:+,$extra}]"  # with the optional parts the release folder carries
            ACXELIN_INSTALL_TEST=1 python -m pytest -q "products/$PRODUCT/tests" --ignore="products/$PRODUCT/tests/browser"; fi
      - name: What the customer receives (the product's wheels with acxelin-core and every dependency, installers, manual, licence) with checksums
        run: |
          if [ "$PRODUCT" = core ]; then pip wheel --wheel-dir wheelhouse ./core; else python tools/wheelhouse.py "$PRODUCT" wheelhouse; fi
          python -m venv /tmp/check && /tmp/check/bin/pip install --no-index --find-links wheelhouse "acxelin-$PRODUCT"
          name="acxelin-$PRODUCT-$VERSION-wheelhouse"
          mv wheelhouse "$name" && tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" "$name"/*.whl > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "acxelin-*-wheelhouse.tar.gz"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          folder=$([ "$PRODUCT" = core ] && echo core || echo "products/$PRODUCT")
          python - "$folder/CHANGELOG.md" "$VERSION" > notes.md <<'PY'
          import re, sys
          text = open(sys.argv[1]).read()
          m = re.search(rf"^## {re.escape(sys.argv[2])}\b.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          print(m.group(1).strip() if m else "")
          PY
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" "acxelin-$PRODUCT-$VERSION-wheelhouse.tar.gz" SHA256SUMS --title "Acxelin $PRODUCT $VERSION" --notes-file notes.md
  image:
    needs: [gate, build]
    if: needs.gate.outputs.product != 'core'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      PRODUCT: ${{ needs.gate.outputs.product }}
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build, smoke-test and push the container image
        id: push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/acxelin-$PRODUCT"
          docker build -f "products/$PRODUCT/deploy/Dockerfile" -t "$image:$VERSION" .
          docker run --rm "$image:$VERSION" doctor
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$image:$VERSION"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$VERSION" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
  installers:
    # Acxelin VPN's desktop app: the Windows Setup, the macOS disk image and the Linux package, each installed and checked before upload
    needs: [gate, build]
    if: needs.gate.outputs.product == 'vpn'
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: ./.github/actions/installer
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/installers/*"
      - name: Add it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" dist/installers/* --clobber
  checksums:
    # the desktop installers join SHA256SUMS, so people check them the same way as the archive
    needs: [gate, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$REPO" -p SHA256SUMS -p "Acxelin-VPN-*" -p "acxelin-vpn_*"
          sha256sum Acxelin-VPN-* acxelin-vpn_* >> SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" -R "$REPO" SHA256SUMS --clobber
