name: pages
on:
  push:
    branches: [main]
    paths: ["website/**", "documents/**", "products/*/docs/**", "products/*/src/**", "products/*/examples/**", "tools/build_site.py", "core/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    container: python:3.13-slim-trixie@sha256:7c61056e61ac89e852de05f3dc6fa51a6dd2181797bceed46aa725dd7cb2cd3b  # OpenSSL 3.5, as website.yml builds
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apt-get update && apt-get install -y --no-install-recommends git
      - name: The website, its demo pages produced by running the products from this commit
        run: pip install ./core "./products/readiness[crawler]" ./products/tls ./products/vpn && python tools/build_site.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
