name: website
on:
  push:
    paths: ["website/**", "documents/**", "products/*/docs/**", "products/*/src/**", "tools/build_site.py", "core/**", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", "documents/**", "products/*/docs/**", "products/*/src/**", "tools/build_site.py", "core/**", ".github/workflows/website.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: python:3.13-slim-trixie@sha256:7c61056e61ac89e852de05f3dc6fa51a6dd2181797bceed46aa725dd7cb2cd3b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apt-get update && apt-get install -y --no-install-recommends nodejs npm git
      - run: pip install ./core "./products/readiness[crawler]" ./products/tls ./products/vpn pytest playwright==1.56.0
      - run: python -m playwright install --with-deps chromium && npm ci --prefix tools/browser
      - name: Build (the demo pages run the products, so a broken product fails the build) and test every page
        run: python tools/build_site.py && python -m pytest -q website/tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website
          path: build/site
