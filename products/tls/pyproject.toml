[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acxelin-tls"
version = "1.0.3"
description = "Acxelin TLS: post-quantum TLS 1.3 and mTLS in front of the services you already run, with its own certificate authority"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=49", "acxelin-core>=1.1.1,<2"]
authors = [{name = "Acxelin Quantum"}]
license = {file = "LICENSE"}
classifiers = ["License :: Other/Proprietary License", "Private :: Do Not Upload"]

[project.optional-dependencies]
kms = ["boto3>=1.35"]
test = ["coverage>=7.6", "hypothesis>=6.100", "pytest>=9", "acme>=4", "certbot>=4; sys_platform != 'win32'"]

[project.scripts]
acxelin-tls = "acxelin_tls.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"acxelin_tls" = ["console.html"]
