# .acxelin-readiness.toml: put it at the root of the folder you scan. Every key is optional.
exclude = ["generated", "*.min.js"]   # name globs, or path globs from the root
include_vendor = false                # also scan vendor/, node_modules/ and similar
tls = ["api.example.com:443"]         # live endpoints probed on every scan
ssh = ["bastion.example.com"]
aws = ["eu-west-1"]                   # AWS regions whose KMS keys and ACM certificates are read (the aws extra)
shelf_life = 10                       # years the protected data must stay secret
migration = 5                         # years your migration will take
crqc_year = 2035                      # assumed year a cryptographically relevant quantum computer exists
fail_on = "high"                      # exit 2 at this tier or worse
rate = 2                              # live probes: new connections a second to one host:port (0 for no limit)
workers = 4                           # live probes: endpoints probed at once (scan probes one at a time unless set)
aggressive = false                    # true: no pacing and 16 workers, as before pacing was added

[policy]
profiles = ["nist-ir-8547", "cnsa-2.0"]
forbid = ["MD5", "SHA-1"]
min_bits = {RSA = 3072}
require_hybrid = true
