<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acxelin Readiness</title>
<style>
/*SHELL*/
.split{grid-template-columns:minmax(0,230px) minmax(0,1fr)}
@media (max-width:780px){.split{grid-template-columns:minmax(0,1fr)}#pj-main{order:-1}}
td.asset{font-family:var(--mono);font-size:13px}
details.where summary::after,details.more summary::after{content:"";display:inline-block;width:5px;height:5px;margin:0 2px 2px 8px;
border:solid var(--muted);border-width:0 1.5px 1.5px 0;transform:rotate(-45deg);vertical-align:middle}
details.where[open] summary::after,details.more[open] summary::after{transform:rotate(45deg);margin-bottom:4px}
details.track summary{white-space:nowrap;list-style:none}details.track summary::-webkit-details-marker{display:none}
details.track summary{text-decoration:underline;text-decoration-color:var(--rule-strong);text-underline-offset:3px}
details.where summary{cursor:pointer;list-style:none;font-family:var(--mono);font-size:13px}details.where summary::-webkit-details-marker{display:none}
details.where ul{margin:8px 0 2px;padding-left:16px;font:12.5px/1.6 var(--mono);color:var(--body)}details.where p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.counts button{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:center;border-radius:6px;padding:4px 6px}.counts button:hover{background:var(--sunken)}
.score{margin:2px 0 4px;color:var(--body)}.score strong{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
figure.trend{margin:14px 0 6px;max-width:460px}figure.trend svg{display:block;width:100%;height:auto;color:var(--ink)}
figure.trend .axis{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:4px}
figure.trend figcaption{font-size:12.5px;color:var(--muted);margin-top:6px}
#targets{max-width:62ch}.results{margin-top:28px;padding-top:22px;border-top:1px solid var(--rule)}
details.more summary{cursor:pointer;list-style:none;font-size:13px;color:var(--muted)}details.more summary::-webkit-details-marker{display:none}
details.more p{font-size:13px;color:var(--muted);margin:6px 0 0}
@media print{.share,.analyses,.tabs,.brandbar small,#msg,.split>div:first-child,button,textarea,label[for=targets],details.more,details.track form{display:none!important}.split{display:block}
.scroll{overflow:visible!important;border:0}details.where[open] ul{break-inside:avoid}body{background:#fff}*:focus-visible{outline:none!important}.results{border:0;margin:0}}
input[type=file]{font:inherit;font-size:13.5px;color:var(--body);max-width:100%}
small.basis{display:block;margin-top:3px;font-size:12.5px;color:var(--muted)}
ul.history{margin:6px 0 0;padding-left:16px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.outlook{margin:8px 0 0;padding-left:20px;max-width:80ch}.outlook li{margin:0 0 10px}
.glance{margin:18px 0 8px;padding:16px 18px;border:1px solid var(--rule);border-radius:8px;background:var(--pane)}
.glance ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;max-width:80ch}.glance li{color:var(--body)}.glance strong{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.analyses{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.analyses button{all:unset;cursor:pointer;display:grid;gap:2px;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--bg)}
.analyses button:hover{border-color:var(--rule-strong)}.analyses button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.analyses b{font-weight:600;color:var(--ink);font-size:13.5px}.analyses span{font-size:12.5px;color:var(--muted)}
@media (max-width:620px){.analyses{grid-template-columns:repeat(2,minmax(0,1fr))}}
.analysis{margin-top:30px;padding-top:20px;border-top:1px solid var(--rule)}.analysis h2{scroll-margin-top:12px}.analysis h2:focus{outline:none}
.analysis h2 .kind{font-size:12.5px;font-weight:400;color:var(--muted);margin-left:6px;white-space:nowrap}
.analysis h3{font-size:14px;font-weight:600;color:var(--ink);margin:22px 0 8px}
.dist{display:flex;height:24px;gap:2px;margin:12px 0 10px;max-width:720px}
.dist .seg{display:flex;align-items:center;justify-content:center;min-width:4px;border-radius:4px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink);border:1px solid transparent}
.seg.critical,.seg.bad{background:var(--bad-ground);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.seg.high,.seg.exposed{background:repeating-linear-gradient(135deg,var(--hatch) 0 3px,transparent 3px 6px),var(--exposed-ground);color:var(--exposed);border-color:color-mix(in srgb,var(--exposed) 45%,transparent)}
.seg.medium{background:var(--pane);color:var(--exposed);border-color:color-mix(in srgb,var(--exposed) 45%,transparent)}
.seg.low,.seg.mute{background:var(--sunken);color:var(--body);border-color:var(--rule)}.seg.ok{background:var(--ok-ground);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
dl.key{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 14px;margin:10px 0 0;max-width:80ch}dl.key dd{margin:0;color:var(--body)}
.bars{display:grid;gap:6px;max-width:620px}.bar-row{display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr) 3em;gap:10px;align-items:center;font-size:13.5px}
.bar-track{height:10px}.bar{display:block;height:100%;border-radius:2px;background:var(--ink)}
.bar.bad{background:var(--bad)}.bar.exposed{background:repeating-linear-gradient(135deg,var(--hatch) 0 3px,transparent 3px 6px),var(--exposed)}.bar.low{background:var(--muted)}.bar.ok{background:var(--ok)}
@media (max-width:520px){.bar-row{grid-template-columns:minmax(0,1fr) 3em}.bar-track{display:none}}
.outlook li small{display:block;color:var(--muted);font:12.5px/1.6 var(--mono);overflow-wrap:anywhere}
.more-rows{margin-top:10px}
.progress{margin:14px 0 6px;max-width:720px}.progress p{margin:0}.progress .dist{height:12px;margin:8px 0 6px}
.seg.s-ok{background:var(--ok);border-color:var(--ok)}.seg.s-low{background:var(--sunken);border-color:var(--rule-strong)}
.seg.s-progress{background:var(--pane);border:1.5px solid var(--ink)}.seg.s-planned{background:var(--select);border-color:var(--rule-strong)}.seg.s-open{background:var(--pane);border-color:var(--rule)}
.progress .seg{font-size:0}
details.names summary{cursor:pointer;list-style:none}details.names summary::-webkit-details-marker{display:none}details.names summary small{text-decoration:underline dotted;text-underline-offset:3px}
.glance ul.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 12px;max-width:none}
.cards li{display:grid;gap:2px;align-content:start;padding:12px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--bg)}
.cards li strong{font:500 26px/1.15 var(--display);letter-spacing:-.01em}.cards li span{color:var(--ink);font-size:13.5px}.cards li small{color:var(--muted);font-size:12.5px}
.cards li.bad strong{color:var(--bad)}.cards li.ok strong{color:var(--ok)}
.cards li.exposed{background:repeating-linear-gradient(135deg,var(--hatch) 0 3px,transparent 3px 6px),var(--exposed-ground);border-color:color-mix(in srgb,var(--exposed) 45%,transparent)}.cards li.exposed strong{color:var(--exposed)}
.start{max-width:760px;padding-top:12px}.choice{display:grid;grid-template-columns:32px minmax(0,1fr);gap:14px;padding:20px;margin-top:14px;border:1px solid var(--rule);border-radius:8px;background:var(--pane)}
.choice h2{margin:2px 0 4px;font-size:17px}.choice .state{margin:0 0 12px}.choice .import{margin-top:0}
.step{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--rule-strong);font:500 13px/1 var(--mono);color:var(--ink)}
.import{margin-top:22px}input[type=file]::file-selector-button{font:500 13.5px var(--display);min-height:34px;padding:0 12px;margin-right:10px;border:1px solid var(--rule-strong);border-radius:6px;background:var(--pane);color:var(--ink);cursor:pointer}
input[type=file]::file-selector-button:hover{border-color:var(--ink)}
.share{margin-top:30px;padding-top:20px;border-top:1px solid var(--rule)}.share .state{margin:0 0 12px}
details.fix{margin-top:6px}details.fix summary{cursor:pointer;font-size:12.5px;color:var(--muted);text-decoration:underline;text-decoration-color:var(--rule-strong);text-underline-offset:3px}
.fixpair{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:8px}.fixpair figure{margin:0;min-width:0}
.fixpair figcaption{font-size:12px;color:var(--muted);margin-bottom:3px}.fixpair pre{margin:0;padding:8px 10px;border-radius:6px;background:var(--sunken);overflow-x:auto;font:12px/1.5 var(--mono);color:var(--ink)}
.changes{margin:12px 0}.changes .pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.change{padding:10px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--pane)}.change h3{margin:0 0 6px;font-size:13.5px}
.change.gone{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}.change ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:13px}
button.linkish{all:unset;cursor:pointer;color:var(--ink);font-weight:500;text-decoration:underline;text-decoration-color:var(--rule-strong);text-underline-offset:3px}
button.linkish:focus-visible{outline:2px solid var(--ink);outline-offset:2px}ul.runs{margin:0;padding:0;list-style:none;display:grid;gap:6px}
ul.runs summary{cursor:pointer;font-size:13.5px}ul.runs p{margin:6px 0 0;font-size:13px;color:var(--body);overflow-wrap:anywhere}
.counts button:focus-visible{outline:2px solid var(--ink)}.counts button[aria-pressed="true"]{background:var(--select)}
td.num,th.num{text-align:right}#ov h2{margin-top:34px}.note{margin:0 0 14px;color:var(--ok)}.note:empty,.msg:empty{display:none}
.meter{display:inline-block;width:56px;height:6px;margin-left:8px;border-radius:3px;background:var(--sunken);vertical-align:middle;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink)}.find{max-width:340px;margin:14px 0 4px}.find input{min-height:36px;padding:6px 10px}
details.add{margin-top:22px;padding-top:14px;border-top:1px solid var(--rule)}details.add>summary{cursor:pointer;font-weight:500;color:var(--ink)}
#board{margin:8px 0 30px;padding:22px 24px;border:1px solid var(--rule);border-radius:8px;background:var(--pane);max-width:880px}
#board h2{margin:0 0 2px}#board .cards{margin:14px 0}#board h3{font-size:14px;margin:18px 0 6px}#board ol,#board ul{margin:0;padding-left:20px}
#board li small{color:var(--muted)}#board ul.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;list-style:none;padding:0}.provisional{margin:8px 0 0;padding:8px 12px;border-radius:6px;background:var(--exposed-ground);color:var(--ink);font-size:13.5px}
@media print{body.board-print #panel>*:not(#board),body.board-print .tabs,body.board-print .brandbar small{display:none!important}
body.board-print #board{border:0;padding:0;margin:0;background:none}}
kbd{font:12px var(--mono);padding:0 5px;border:1px solid var(--rule-strong);border-radius:4px;color:var(--muted)}
</style>
</head>
<body>
<main>
<header class="brandbar"><div class="logo"><!--LOGO--></div><span class="product">Acxelin Readiness</span><small>Local console. Only this computer can open it.</small></header>
<p class="msg" id="msg" role="alert"></p><p class="note" id="note" role="status"></p>
<div id="app"><p class="lede">Opening the console…</p></div>
</main>
<script>
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, props = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, ""); else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const k of kids.flat()) el.append(k instanceof Node ? k : document.createTextNode(k ?? ""));
  return el;
};
const calm = matchMedia("(prefers-reduced-motion: reduce)");
const say = (text) => { const m = $("#msg"); m.replaceChildren(...acxText(text || "")); if (text) m.scrollIntoView({block: "center", behavior: calm.matches ? "auto" : "smooth"}); };
let noteTimer;
const notify = (text) => { $("#note").textContent = text; clearTimeout(noteTimer); noteTimer = setTimeout(() => { $("#note").textContent = ""; }, 6000); };
const sure = (text) => confirm(text);
const state = {tab: "projects", status: null, projects: null, endpoints: null, selected: 0, timer: null, targets: "", filter: null, service: null, showOk: false, query: ""};
const when = (t) => t ? new Date(t * 1000).toISOString().slice(0, 16).replace("T", " ") + " UTC" : "never";
const call = async (path, body) => { try { say(""); if (body) $("#note").textContent = ""; return await acx.api(path, body); } catch (e) { say(e.status === 401 ? "This session has ended. Run the console command again to open a new one." : e.message); throw e; } };

function signedOut() {
  $("#app").replaceChildren(h("div", {class: "narrow"}, h("h1", {}, "This link has expired"),
    h("p", {class: "lede"}, "Each launch link works once. In a terminal, run ", h("code", {class: "cmd"}, "acxelin-readiness console"), " to open a new one."),
    h("p", {class: "lede"}, "On a remote server, forward the port with SSH, then run ", h("code", {class: "cmd"}, "acxelin-readiness console link"), " in that session.")));
}

function setup() {
  const input = h("input", {type: "text", id: "dir", autocomplete: "off", placeholder: state.status.example, required: true});
  const go = async () => {
    try { await call("setup", {directory: input.value}); await load(); $("#tab-projects").focus(); }
    catch (e) { input.setAttribute("aria-invalid", "true"); input.setAttribute("aria-describedby", "msg"); input.focus(); }
  };
  const choice = (n, title, text, ...kids) => h("section", {class: "choice", "aria-labelledby": "choice-" + n}, h("span", {class: "step", "aria-hidden": "true"}, String(n)),
    h("div", {}, h("h2", {id: "choice-" + n}, title), h("p", {class: "state"}, text), ...kids));
  $("#panel").replaceChildren(h("div", {class: "start"}, h("h1", {}, "What would you like to check?"),
    h("p", {class: "lede"}, "Readiness reads your code and files on this computer and never sends them anywhere. Pick one to start; you can add the others later. To grade live servers instead, open Endpoints."),
    choice(1, "Repositories on this computer", "The folder that holds your repositories. Readiness only scans folders inside it.",
      h("label", {for: "dir"}, "Folder path"), input, h("div", {class: "row", style: "margin-top:12px"}, h("button", {class: "btn", onclick: go}, "Use this folder"))),
    choice(2, "A GitHub repository", "Public, or private with a read-only token. It is downloaded to this computer and scanned here.", githubForm("Repository link")),
    choice(3, "A CBOM from another tool", "Its findings are rated on the same scale as a scan.", importForm())));
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  input.focus();
}

async function addAndScan(project) {
  state.selected = project; state.filter = null; state.service = null;
  await call("projects/select", {project}); await load(); await call("projects/scan", {project}); pollProject();
}
function githubForm(label = "Add from GitHub") {
  const url = h("input", {type: "text", inputmode: "url", id: "gh", autocomplete: "off", spellcheck: "false", placeholder: "https://github.com/owner/repository"});
  const add = async () => { try { const r = await call("projects/github", {url: url.value}); await addAndScan(r.project); } catch (e) {} };
  url.addEventListener("keydown", (e) => { if (e.key === "Enter") add(); });
  const token = h("input", {type: "password", id: "ghtoken", autocomplete: "off"});
  const saveToken = async (value) => {
    if (!value && !sure("Remove the saved GitHub token? Private repositories can't be downloaded until you add one again.")) return;
    try { await call("github/token", {token: value}); token.value = ""; await load(); notify(value ? "Token saved." : "Token removed."); } catch (e) {}
  };
  const saved = state.status.github_token;
  return h("div", {}, h("label", {for: "gh", style: "margin-top:0"}, label), url,
    h("div", {style: "margin-top:10px"}, h("button", {class: "btn quiet", onclick: add}, "Download and scan")),
    h("details", {class: "more", style: "margin-top:12px"}, h("summary", {}, saved ? "Private repositories: token saved" : "Private repositories"),
      h("p", {}, "A fine-grained token with read-only Contents access. It is kept on this computer, readable only by you, and sent only to api.github.com."),
      h("label", {for: "ghtoken"}, "Access token"), token,
      h("div", {class: "row", style: "margin-top:10px"}, h("button", {class: "btn quiet", onclick: () => saveToken(token.value)}, "Save token"),
        saved ? h("button", {class: "btn quiet", onclick: () => saveToken("")}, "Remove token") : "")));
}

const TABS = ["projects", "overview", "endpoints"];
function importForm() {
  const file = h("input", {type: "file", id: "cbomfile", accept: ".json,application/json"});
  const go = async () => {
    const f = file.files[0];
    if (!f) return say("Choose a CBOM file first.");
    if (f.size > 16e6) return say("That CBOM is over 16 MB. Merge it on the command line with `acxelin-readiness merge` instead.");
    let cbom;
    try { cbom = JSON.parse(await f.text()); } catch (e) { return say("That file is not JSON. Choose a CycloneDX CBOM (.json)."); }
    try { const r = await call("projects/import", {name: f.name, cbom}); await addAndScan(r.project); } catch (e) {}
  };
  return h("div", {class: "import"}, h("label", {for: "cbomfile", style: "margin-top:0"}, "Import a CBOM"), file,
    h("p", {class: "legend", style: "margin-top:4px"}, "A CycloneDX file from another tool, such as CodeQL."),
    h("div", {style: "margin-top:10px"}, h("button", {class: "btn quiet", onclick: go}, "Import and rate")));
}

function shell() {
  const open = (id) => { clearInterval(state.timer); state.tab = id; shell(); $("#tab-" + id).focus(); };
  const keys = (e) => {
    const i = TABS.indexOf(state.tab), next = {ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: TABS.length - 1}[e.key];
    if (next === undefined) return;
    e.preventDefault(); open(TABS[(next + TABS.length) % TABS.length]);
  };
  const tab = (id, label) => h("button", {role: "tab", id: "tab-" + id, "aria-selected": String(state.tab === id), tabindex: state.tab === id ? "0" : "-1", "aria-controls": "panel",
    onclick: () => open(id), onkeydown: keys}, label);
  $("#app").replaceChildren(h("div", {class: "tabs", role: "tablist", "aria-label": "Console"}, tab("projects", "Projects"), tab("overview", "Overview"), tab("endpoints", "Endpoints")),
    h("div", {id: "panel", role: "tabpanel", "aria-labelledby": "tab-" + state.tab}));
  ({projects: projectsView, overview: overviewView, endpoints: endpointsView})[state.tab]();
}

// ---- the readiness score and its trend

const day = (t) => new Date(t * 1000).toISOString().slice(0, 10);
const stamp = (rows, r) => day(rows[0].finished) === day(rows[rows.length - 1].finished) ? when(r.finished).slice(11) : day(r.finished);
function scoreView(score, rows, definition, cover) {
  rows = rows.filter((r) => typeof r.score === "number");
  const covered = rows.filter((r) => typeof r.coverage === "number"), before = covered.length > 1 ? covered[covered.length - 2].coverage : null;
  const coverage = cover && cover.percent != null ? [h("p", {class: "state", style: "margin-top:0"}, "Coverage " + cover.percent + "%: " + cover.text + "."),
    before != null && before - cover.percent >= 10 ? h("p", {class: "legend", style: "color:var(--ink)"}, "Coverage fell from " + before + "% to " + cover.percent +
      "% since the scan before, so this score rests on less than the last one. Compare them with care.") : ""] : [];
  const first = rows.length > 1 ? rows[0] : null, change = first ? score - first.score : 0;
  const out = [h("p", {class: "score"}, score == null ? "Nothing to score yet." : [
    "Readiness ", h("strong", {}, score + " of 100"),
    first ? (change ? (change > 0 ? ", up " : ", down ") + Math.abs(change) + " since " + stamp(rows, first) : ", unchanged since " + stamp(rows, first)) + "." : "."])];
  if (rows.length < 2) return out.concat(coverage, h("details", {class: "more"}, h("summary", {}, "How the score works"), h("p", {}, definition)));
  const w = 460, ht = 96, pad = 8, x = (i) => pad + i * (w - 2 * pad) / (rows.length - 1), y = (v) => ht - pad - v * (ht - 2 * pad) / 100;
  const pts = rows.map((r, i) => x(i).toFixed(1) + "," + y(Number(r.score)).toFixed(1)).join(" ");
  const dots = rows.map((r, i) => `<g><title>${when(Number(r.finished))}: ${Number(r.score)}</title><circle cx="${x(i).toFixed(1)}" cy="${y(Number(r.score)).toFixed(1)}" r="10" fill="transparent"/><circle cx="${x(i).toFixed(1)}" cy="${y(Number(r.score)).toFixed(1)}" r="4" fill="currentColor"/></g>`).join("");
  const box = document.createElement("div");
  box.innerHTML = `<svg viewBox="0 0 ${w} ${ht}" role="img" aria-label="Readiness score over the last ${rows.length} scans, from ${Number(rows[0].score)} to ${Number(rows[rows.length - 1].score)}">` +
    `<line x1="${pad}" y1="${y(0)}" x2="${w - pad}" y2="${y(0)}" stroke="currentColor" stroke-opacity=".3"/><line x1="${pad}" y1="${y(100)}" x2="${w - pad}" y2="${y(100)}" stroke="currentColor" stroke-opacity=".12" stroke-dasharray="3 4"/>` +
    `<polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>${dots}</svg>`;
  const axis = (r) => h("span", {}, stamp(rows, r) + ": " + r.score);
  out.push(...coverage, h("figure", {class: "trend"}, box.firstChild, h("div", {class: "axis", "aria-hidden": "true"}, axis(rows[0]), axis(rows[rows.length - 1])),
    h("figcaption", {}, "Readiness over the last " + rows.length + " scans, on a scale from 0 to 100. " + definition)),
    h("details", {class: "more"}, h("summary", {}, "Score history as a table"),

    b.disabled = e.running; st.textContent = e.running ? "Checking endpoints…" : (e.error || ""); st.style.color = !e.running && e.error ? "var(--bad)" : "";
    if (state.restore && e.last) { state.restore = false; $("#targets").value = state.targets = e.last.targets.join("\n"); }
    $("#ep-result").hidden = !e.last;

  } catch (e) { return null; }
}
function pollEndpoints() { clearInterval(state.timer); state.timer = setInterval(async () => { const e = await refreshEndpoints(); if (!e || !e.running) clearInterval(state.timer); }, 600); refreshEndpoints(); }

async function load() {
  try { state.status = await call("status"); state.selected = state.status.selected || 0; } catch (e) { return signedOut(); }
  shell();
  if (state.status.notice) say(state.status.notice);
  if (!state.status.configured && state.tab === "projects") $("#dir")?.focus();
}
acx.start().then((ok) => (ok ? load() : signedOut()));
</script>
