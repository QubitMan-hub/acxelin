<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acxelin Readiness</title>
<style>
/*SHELL*/
.split{grid-template-columns:minmax(0,230px) minmax(0,1fr)}
@media (max-width:780px){.split{grid-template-columns:minmax(0,1fr)}#pj-main{order:-1}}
td.asset{font-family:var(--mono);font-size:13px}
details.where summary::after,details.more summary::after{content:"";display:inline-block;width:5px;height:5px;margin:0 2px 2px 8px;
border:solid var(--muted);border-width:0 1.5px 1.5px 0;transform:rotate(-45deg);vertical-align:middle}
details.where[open] summary::after,details.more[open] summary::after{transform:rotate(45deg);margin-bottom:4px}
details.track summary{white-space:nowrap;list-style:none}details.track summary::-webkit-details-marker{display:none}
details.track summary{text-decoration:underline;text-decoration-color:var(--rule-strong);text-underline-offset:3px}
details.where summary{cursor:pointer;list-style:none;font-family:var(--mono);font-size:13px}details.where summary::-webkit-details-marker{display:none}
details.where ul{margin:8px 0 2px;padding-left:16px;font:12.5px/1.6 var(--mono);color:var(--body)}details.where p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.counts button{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:center;border-radius:6px;padding:4px 6px}.counts button:hover{background:var(--sunken)}
.score{margin:2px 0 4px;color:var(--body)}.score strong{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
figure.trend{margin:14px 0 6px;max-width:460px}figure.trend svg{display:block;width:100%;height:auto;color:var(--ink)}
figure.trend .axis{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:4px}
figure.trend figcaption{font-size:12.5px;color:var(--muted);margin-top:6px}
#targets{max-width:62ch}.results{margin-top:28px;padding-top:22px;border-top:1px solid var(--rule)}
details.more summary{cursor:pointer;list-style:none;font-size:13px;color:var(--muted)}details.more summary::-webkit-details-marker{display:none}
details.more p{font-size:13px;color:var(--muted);margin:6px 0 0}
@media print{.tabs,.brandbar small,#msg,.split>div:first-child,button,textarea,label[for=targets],details.more,details.track form{display:none!important}.split{display:block}
.scroll{overflow:visible!important;border:0}details.where[open] ul{break-inside:avoid}body{background:#fff}*:focus-visible{outline:none!important}.results{border:0;margin:0}}
input[type=file]{font:inherit;font-size:13.5px;color:var(--body);max-width:100%}
small.basis{display:block;margin-top:3px;font-size:12.5px;color:var(--muted)}
ul.history{margin:6px 0 0;padding-left:16px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.outlook{margin:24px 0 0}.outlook ul,.outlook ol{margin:8px 0 0;padding-left:20px;max-width:80ch}.outlook li{margin:0 0 10px}
.outlook li small{display:block;color:var(--muted);font:12.5px/1.6 var(--mono);overflow-wrap:anywhere}
.counts button:focus-visible{outline:2px solid var(--ink)}.counts button[aria-pressed="true"]{background:var(--select)}
</style>
</head>
<body>
<main>
<header class="brandbar"><div class="logo"><!--LOGO--></div><span class="product">Acxelin Readiness</span><small>Local console. Only this computer can open it.</small></header>
<p class="msg" id="msg" role="alert"></p>
<div id="app"><p class="lede">Opening the console…</p></div>
</main>
<script>
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, props = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, ""); else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const k of kids.flat()) el.append(k instanceof Node ? k : document.createTextNode(k ?? ""));
  return el;
};
const calm = matchMedia("(prefers-reduced-motion: reduce)");
const say = (text) => { const m = $("#msg"); m.replaceChildren(...acxText(text || "")); if (text) m.scrollIntoView({block: "center", behavior: calm.matches ? "auto" : "smooth"}); };
const state = {tab: "projects", status: null, projects: null, endpoints: null, selected: 0, timer: null, targets: "", filter: null};
const when = (t) => t ? new Date(t * 1000).toISOString().slice(0, 16).replace("T", " ") + " UTC" : "never";
const call = async (path, body) => { try { say(""); return await acx.api(path, body); } catch (e) { say(e.status === 401 ? "This session has ended. Run the console command again to open a new one." : e.message); throw e; } };

function signedOut() {
  $("#app").replaceChildren(h("div", {class: "narrow"}, h("h1", {}, "This link has expired"),
    h("p", {class: "lede"}, "Each launch link works once. In a terminal, run ", h("code", {class: "cmd"}, "acxelin-readiness console"), " to open a new one."),
    h("p", {class: "lede"}, "On a remote server, forward the port with SSH, then run ", h("code", {class: "cmd"}, "acxelin-readiness console link"), " in that session.")));
}

function setup() {
  const input = h("input", {type: "text", id: "dir", autocomplete: "off", placeholder: state.status.example, required: true});
  const go = async () => {
    try { await call("setup", {directory: input.value}); await load(); $("#tab-projects").focus(); }
    catch (e) { input.setAttribute("aria-invalid", "true"); input.setAttribute("aria-describedby", "msg"); input.focus(); }
  };
  $("#panel").replaceChildren(h("div", {class: "narrow"}, h("h1", {}, "Where are your repositories?"),
    h("p", {class: "lede"}, "Acxelin Readiness only scans folders inside the one you choose here. Enter the full path of the folder that holds your repositories. To grade servers instead, open Endpoints; it needs no folder."),
    h("label", {for: "dir"}, "Folder path"), input,
    h("div", {class: "row", style: "margin-top:18px"}, h("button", {class: "btn", onclick: go}, "Use this folder")),
    h("h2", {style: "margin-top:32px"}, "Or scan a GitHub repository"), githubForm("Repository link"), importForm()));
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  input.focus();
}

async function addAndScan(project) {
  state.selected = project; state.filter = null;
  await call("projects/select", {project}); await load(); await call("projects/scan", {project}); pollProject();
}
function githubForm(label = "Add from GitHub") {
  const url = h("input", {type: "text", inputmode: "url", id: "gh", autocomplete: "off", spellcheck: "false", placeholder: "https://github.com/owner/repository"});
  const add = async () => { try { const r = await call("projects/github", {url: url.value}); await addAndScan(r.project); } catch (e) {} };
  url.addEventListener("keydown", (e) => { if (e.key === "Enter") add(); });
  const token = h("input", {type: "password", id: "ghtoken", autocomplete: "off"});
  const saveToken = async (value) => { try { await call("github/token", {token: value}); token.value = ""; await load(); } catch (e) {} };
  const saved = state.status.github_token;
  return h("div", {}, h("label", {for: "gh", style: "margin-top:0"}, label), url,
    h("div", {style: "margin-top:10px"}, h("button", {class: "btn quiet", onclick: add}, "Download and scan")),
    h("details", {class: "more", style: "margin-top:12px"}, h("summary", {}, saved ? "Private repositories: token saved" : "Private repositories"),
      h("p", {}, "A fine-grained token with read-only Contents access. It is kept on this computer, readable only by you, and sent only to api.github.com."),
      h("label", {for: "ghtoken"}, "Access token"), token,
      h("div", {class: "row", style: "margin-top:10px"}, h("button", {class: "btn quiet", onclick: () => saveToken(token.value)}, "Save token"),
        saved ? h("button", {class: "btn quiet", onclick: () => saveToken("")}, "Remove token") : "")));
}

const TABS = ["projects", "endpoints"];
function importForm() {
  const file = h("input", {type: "file", id: "cbomfile", accept: ".json,application/json"});
  const go = async () => {
    const f = file.files[0];
    if (!f) return say("Choose a CBOM file first.");
    if (f.size > 16e6) return say("That CBOM is over 16 MB. Merge it on the command line with `acxelin-readiness merge` instead.");
    let cbom;
    try { cbom = JSON.parse(await f.text()); } catch (e) { return say("That file is not JSON. Choose a CycloneDX CBOM (.json)."); }
    try { const r = await call("projects/import", {name: f.name, cbom}); await addAndScan(r.project); } catch (e) {}
  };
  return h("div", {style: "margin-top:22px"}, h("label", {for: "cbomfile", style: "margin-top:0"}, "Import a CBOM"), file,
    h("p", {class: "legend", style: "margin-top:4px"}, "A CycloneDX file from another tool, such as CodeQL."),
    h("div", {style: "margin-top:10px"}, h("button", {class: "btn quiet", onclick: go}, "Import and rate")));
}

function shell() {
  const open = (id) => { clearInterval(state.timer); state.tab = id; shell(); $("#tab-" + id).focus(); };
  const keys = (e) => {
    const i = TABS.indexOf(state.tab), next = {ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: TABS.length - 1}[e.key];
    if (next === undefined) return;
    e.preventDefault(); open(TABS[(next + TABS.length) % TABS.length]);
  };
  const tab = (id, label) => h("button", {role: "tab", id: "tab-" + id, "aria-selected": String(state.tab === id), tabindex: state.tab === id ? "0" : "-1", "aria-controls": "panel",
    onclick: () => open(id), onkeydown: keys}, label);
  $("#app").replaceChildren(h("div", {class: "tabs", role: "tablist", "aria-label": "Console"}, tab("projects", "Projects"), tab("endpoints", "Endpoints")),
    h("div", {id: "panel", role: "tabpanel", "aria-labelledby": "tab-" + state.tab}));
  (state.tab === "projects" ? projectsView : endpointsView)();
}

// ---- the readiness score and its trend

const day = (t) => new Date(t * 1000).toISOString().slice(0, 10);
const stamp = (rows, r) => day(rows[0].finished) === day(rows[rows.length - 1].finished) ? when(r.finished).slice(11) : day(r.finished);
function scoreView(score, rows, definition, cover) {
  rows = rows.filter((r) => typeof r.score === "number");
  const covered = rows.filter((r) => typeof r.coverage === "number"), before = covered.length > 1 ? covered[covered.length - 2].coverage : null;
  const coverage = cover && cover.percent != null ? [h("p", {class: "state", style: "margin-top:0"}, "Coverage " + cover.percent + "%: " + cover.text + "."),
    before != null && before - cover.percent >= 10 ? h("p", {class: "legend", style: "color:var(--ink)"}, "Coverage fell from " + before + "% to " + cover.percent +
      "% since the scan before, so this score rests on less than the last one. Compare them with care.") : ""] : [];
  const first = rows.length > 1 ? rows[0] : null, change = first ? score - first.score : 0;
  const out = [h("p", {class: "score"}, score == null ? "Nothing to score yet." : [
    "Readiness ", h("strong", {}, score + " of 100"),
    first ? (change ? (change > 0 ? ", up " : ", down ") + Math.abs(change) + " since " + stamp(rows, first) : ", unchanged since " + stamp(rows, first)) + "." : "."])];
  if (rows.length < 2) return out.concat(coverage, h("details", {class: "more"}, h("summary", {}, "How the score works"), h("p", {}, definition)));
  const w = 460, ht = 96, pad = 8, x = (i) => pad + i * (w - 2 * pad) / (rows.length - 1), y = (v) => ht - pad - v * (ht - 2 * pad) / 100;
  const pts = rows.map((r, i) => x(i).toFixed(1) + "," + y(Number(r.score)).toFixed(1)).join(" ");
  const dots = rows.map((r, i) => `<g><title>${when(Number(r.finished))}: ${Number(r.score)}</title><circle cx="${x(i).toFixed(1)}" cy="${y(Number(r.score)).toFixed(1)}" r="10" fill="transparent"/><circle cx="${x(i).toFixed(1)}" cy="${y(Number(r.score)).toFixed(1)}" r="4" fill="currentColor"/></g>`).join("");
  const box = document.createElement("div");
  box.innerHTML = `<svg viewBox="0 0 ${w} ${ht}" role="img" aria-label="Readiness score over the last ${rows.length} scans, from ${Number(rows[0].score)} to ${Number(rows[rows.length - 1].score)}">` +
    `<line x1="${pad}" y1="${y(0)}" x2="${w - pad}" y2="${y(0)}" stroke="currentColor" stroke-opacity=".3"/><line x1="${pad}" y1="${y(100)}" x2="${w - pad}" y2="${y(100)}" stroke="currentColor" stroke-opacity=".12" stroke-dasharray="3 4"/>` +
    `<polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>${dots}</svg>`;
  const axis = (r) => h("span", {}, stamp(rows, r) + ": " + r.score);
  out.push(...coverage, h("figure", {class: "trend"}, box.firstChild, h("div", {class: "axis", "aria-hidden": "true"}, axis(rows[0]), axis(rows[rows.length - 1])),
    h("figcaption", {}, "Readiness over the last " + rows.length + " scans, on a scale from 0 to 100. " + definition)),
    h("details", {class: "more"}, h("summary", {}, "Score history as a table"),
    h("div", {class: "scroll", tabindex: "0", role: "region", "aria-label": "Score history"}, h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "Scanned"), h("th", {}, "Score"), h("th", {}, "Coverage"))),
      h("tbody", {}, rows.slice().reverse().map((r) => h("tr", {}, h("td", {}, when(r.finished)), h("td", {class: "num"}, String(r.score)),
        h("td", {class: "num"}, typeof r.coverage === "number" ? r.coverage + "%" : "–"))))))));
  return out;
}

// ---- projects

const tier = (t) => h("span", {class: "tag " + t}, t);
const SEEN = {negotiated: "Negotiated", offered: "Offered", "in code": "In code", configured: "Configured", supported: "Supported only", imported: "Imported"};
const basis = (a) => {
  const parts = [(a.seen || []).map((x) => SEEN[x] || x).join(", "), a.confidence_level ? a.confidence_level + " confidence" : "",
    (a.missing || []).length ? "not seen: " + a.missing.join(", ") : ""].filter(Boolean);
  return parts.length ? h("small", {class: "basis"}, parts.join(" · ")) : "";
};
const STATUS = {open: "To do", planned: "Planned", in_progress: "In progress", fixed: "Fixed", exception: "Accepted risk"};
function progress(assets) {
  const n = {}, still = assets.filter((a) => a.tracking && a.tracking.still_found).length;
  for (const a of assets) if (a.tier !== "ok" || (a.tracking && a.tracking.status !== "open")) { const k = (a.tracking && a.tracking.status) || "open"; n[k] = (n[k] || 0) + 1; }
  const parts = Object.keys(STATUS).filter((k) => n[k]).map((k) => n[k] + " " + STATUS[k].toLowerCase());
  return parts.length ? h("p", {class: "state", id: "pj-progress"}, parts.join(" · ") + (still ? " (" + still + " still found)" : "") + ".") : "";
}
function trackForm(asset) {
  const t = asset.tracking || {}, id = asset.id.slice(0, 8);
  if (asset.tier === "ok" && !t.owner && (t.status || "open") === "open") return "";
  const owner = h("input", {type: "text", value: t.owner || "", id: "o" + id});
  const due = h("input", {type: "date", value: t.due || "", id: "d" + id});
  const status = h("select", {id: "s" + id}, Object.entries(STATUS).map(([v, l]) => h("option", {value: v, selected: (t.status || "open") === v}, l)));
  const reason = h("textarea", {id: "r" + id, rows: "2"}, t.reason || "");
  const until = h("input", {type: "date", value: t.until || "", id: "u" + id});
  const accept = h("div", {hidden: status.value !== "exception"}, h("label", {for: reason.id}, "Why it is accepted"), reason, h("label", {for: until.id}, "Accepted until"), until);
  status.addEventListener("change", () => { accept.hidden = status.value !== "exception"; });
  const save = async (ev) => { ev.preventDefault(); try { await call("projects/track", {project: state.selected, finding: asset.id, owner: owner.value, due: due.value, status: status.value, reason: reason.value, until: until.value}); await refreshProject(); } catch (e) {} };
  const label = t.still_found ? "Fixed, still found" : t.status === "exception" ? "Accepted risk until " + t.until
    : t.status && t.status !== "open" ? STATUS[t.status] + (t.owner ? ": " + t.owner : "") : t.owner ? "Owner: " + t.owner : "Assign an owner";
  const log = (t.log || []).slice().reverse().map((e) => h("li", {}, when(e.at) + " · " + STATUS[e.status] + (e.owner ? " · " + e.owner : "") + (e.due ? " · due " + e.due : "")));
  return h("details", {class: "track"}, h("summary", {style: t.still_found ? "color:var(--bad)" : ""}, label),
    h("form", {onsubmit: save}, h("label", {for: owner.id}, "Owner"), owner, h("label", {for: due.id}, "Due date"), due, h("label", {for: status.id}, "Status"), status, accept,
      h("button", {class: "btn quiet", type: "submit"}, "Save")),
    t.still_found ? h("p", {class: "legend", style: "color:var(--bad)"}, "Marked fixed, but the scan after that still found it.") : "",
    log.length ? h("details", {class: "more"}, h("summary", {}, "History"), h("ul", {class: "history"}, log)) : "");
}
function where(a) {
  const shown = a.locations.slice(0, 50);
  return h("details", {class: "where"}, h("summary", {}, a.name),
    h("ul", {}, shown.map(([f, l]) => h("li", {}, f + ":" + l))),
    a.locations.length > shown.length ? h("p", {}, "and " + (a.locations.length - shown.length) + " more places") : "",
    a.why ? h("p", {}, a.why) : "", a.uncertainty ? h("p", {}, a.uncertainty) : "");
}

function results(p) {
  const out = $("#pj-result");
  if (!out) return;
  const last = p.last;
  if (!last) { out.replaceChildren(h("p", {class: "empty"}, p.running ? "The first scan of this repository is running. Results appear here when it finishes." : "Not scanned yet. Choose Scan repository to see which cryptography this project uses and what to migrate first.")); return; }
  const shown = JSON.stringify([last.finished, state.filter, last.assets.map((a) => a.tracking)]);
  if (out.dataset.shown === shown) return;  // polling during a scan must not close what the reader opened
  out.dataset.shown = shown;
  const shownAssets = last.assets.filter((a) => !a.test_only), tests = last.assets.length - shownAssets.length, pri = {};
  for (const a of shownAssets) pri[a.tier] = (pri[a.tier] || 0) + 1;
  const pick = (k) => { state.filter = state.filter === k ? null : k; results(state.projects); };
  const counts = h("div", {class: "counts"}, ["critical", "high", "medium", "low", "ok"].filter((k) => pri[k]).map((k) =>
    h("button", {"aria-pressed": String(state.filter === k), "aria-label": state.filter === k ? "Show every priority" : "Show only " + k, onclick: () => pick(k)}, tier(k), " ", String(pri[k]))));
  const assets = shownAssets.filter((a) => !state.filter || a.tier === state.filter);
  const rows = assets.map((a) => h("tr", {}, h("td", {class: "asset"}, where(a)), h("td", {}, tier(a.tier)), h("td", {}, a.action || a.why || "", basis(a)), h("td", {class: "num"}, String(a.locations.length)), h("td", {}, trackForm(a))));
  const cd = last.summary.coverage_detail || {}, gaps = Object.entries(cd.not_read || {}).map(([k, n]) => n + " " + k).join(", ");
  out.replaceChildren(...scoreView(last.summary.score ?? null, (last.history || []).map((r) => ({finished: r.finished, score: r.summary.score, coverage: r.summary.coverage})),
      "Each listed finding counts by its priority (ok 100, low 75, medium 50, high 25, critical 0); the score is their average.",
      {percent: last.summary.coverage ?? null, text: cd.read + " of " + cd.files + " source and configuration files analysed" + (gaps ? " (" + gaps + ")" : "")}),
    progress(shownAssets),
    h("p", {class: "state"}, "Scanned " + when(last.finished) + ". " + shownAssets.length + (shownAssets.length === 1 ? " cryptographic asset found" : " cryptographic assets found") + (tests ? ", and " + tests + " only in tests (not listed)." : ".")), counts,
    assets.length ? h("div", {class: "scroll", tabindex: "0", role: "region", "aria-label": "Table, scrolls sideways"}, h("table", {}, h("thead", {}, h("tr", {}, ["Asset", "Priority", "What to do", "Places", "Owner"].map((c) => h("th", {}, c)))), h("tbody", {}, rows))) : h("p", {class: "empty"}, "No cryptography was found in this repository."),
    last.notes && last.notes.length ? h("p", {class: "legend"}, last.notes.join(" ")) : "",
    exports(() => exportCsv("projects/csv", {project: state.selected}, last.project + "-findings.csv")));
}

function projectsView() {
  const s = state.status, panel = $("#panel");
  if (!s.configured && !s.projects.length) return setup();
  const names = new Set(s.projects.map((p) => p.name)), addable = s.available.filter((n) => !names.has(n));
  const pick = h("select", {id: "add"}, addable.map((n) => h("option", {value: n}, n)));
  const add = async () => { try { const r = await call("projects/register", {name: pick.value}); await addAndScan(r.project); } catch (e) {} };
  const choose = async (id) => { try { await call("projects/select", {project: id}); state.selected = id; state.filter = null; projectsView(); } catch (e) {} };
  const side = h("div", {}, h("h2", {}, "Repositories"),
    s.projects.length ? h("ul", {class: "list"}, s.projects.map((p) => h("li", {}, h("button", {"aria-current": String(p.id === state.selected), onclick: () => choose(p.id)}, p.name)))) : h("p", {class: "state"}, "None added yet."),
    addable.length ? h("div", {}, h("label", {for: "add", style: "margin-top:0"}, "Add a repository"), pick, h("div", {style: "margin-top:10px"}, h("button", {class: "btn quiet", onclick: add}, "Add and scan")))
      : !s.configured ? "" : h("p", {class: "state"}, s.available.length ? "Every repository in " + s.directory + " is added." : "No repositories found in " + s.directory + ". Put one there, then reload."),
    h("div", {style: "margin-top:22px"}, githubForm()), importForm());
  const main = h("div", {id: "pj-main"});
  panel.replaceChildren(h("div", {class: "split"}, side, main));
  if (!s.projects.length) { main.replaceChildren(h("h1", {}, "Add your first repository"), h("p", {class: "empty"}, "Choose one under Add a repository. It is scanned straight away, to show which cryptography it uses and what to migrate first.")); return; }
  const button = h("button", {class: "btn", id: "scan"}, "Scan repository");
  main.replaceChildren(h("div", {class: "sectionhead"}, h("h1", {}, s.projects[state.selected].name), h("div", {class: "row"}, button)), h("p", {class: "state", id: "pj-state", role: "status"}), h("div", {id: "pj-result"}));
  button.addEventListener("click", async () => {
    const running = state.projects && state.projects.running;
    try { await call(running ? "projects/cancel" : "projects/scan", running ? {} : {project: state.selected}); pollProject(); } catch (e) {}
  });
  refreshProject();
}

function paint(p) {
  state.projects = p;
  const b = $("#scan"), st = $("#pj-state");
  if (!b) return;
  b.textContent = p.running ? "Stop scan" : "Scan repository";
  b.classList.toggle("quiet", p.running);
  st.textContent = p.running ? (p.stage || "Scanning…") : (p.error || "");
  st.style.color = !p.running && p.error ? "var(--bad)" : "";
  results(p);
}
async function refreshProject() { try { const p = await call("projects/status"); paint(p); return p; } catch (e) { return null; } }
function pollProject() { clearInterval(state.timer); state.timer = setInterval(async () => { const p = await refreshProject(); if (!p || !p.running) clearInterval(state.timer); }, 600); refreshProject(); }

// ---- endpoints

const GRADES = {A: "post-quantum key exchange only", B: "post-quantum offered, classical still accepted", C: "classical only: traffic recorded today can be decrypted later", F: "unreachable, or no TLS at all"};
const GRADE_TONE = {A: "ok", B: "exposed", C: "bad", F: "mute"};
function endpointResults(e) {
  const out = $("#ep-result");
  if (!out) return;
  const last = e.last;
  if (!last) { out.replaceChildren(); return; }
  const life = (c) => !c.expires ? "" : c.days_left < 0 ? h("span", {class: "pill bad"}, "expired " + c.expires)
    : c.days_left < 30 ? h("span", {class: "pill warn"}, c.days_left + " days left") : c.days_left + " days left";
  const rows = last.endpoints.map((r) => h("tr", {}, h("td", {class: "asset"}, r.target),
    h("td", {}, h("span", {class: "pill " + GRADE_TONE[r.grade]}, r.grade, h("span", {class: "sr"}, ": " + GRADES[r.grade]))),
    h("td", {class: r.negotiated ? "asset" : ""}, r.negotiated || r.error || ""),
    h("td", {}, r.certificate ? [h("span", {class: "mono"}, r.certificate.key || ""), r.certificate.expires ? " · " : "", life(r.certificate)] : "",
      r.certificate && r.certificate.issuer ? h("div", {class: "legend", style: "margin:2px 0 0"}, "issued by " + ((r.certificate.issuer.match(/CN=([^,]+)/) || [])[1] || r.certificate.issuer)) : "")));
  const pasted = (last.targets || []).some((t) => /^https?:\/\//i.test(t) || /^[^/]+\/./.test(t.replace(/^\w+:\/\//, "")));
  out.replaceChildren(h("h2", {}, "Last check, " + when(last.finished)),
    ...scoreView(last.summary.score ?? null, e.history || [], "Grade A counts 100, B 50 and C 0; endpoints that could not be graded (F) are left out.",
      {percent: last.summary.coverage ?? null, text: (last.summary.endpoints - last.summary.grades.F) + " of " + last.summary.endpoints + " endpoints could be graded"}),
    h("p", {class: "state"}, last.summary.pq_key_exchange + " of " + last.summary.endpoints + " offer post-quantum key exchange."),
    pasted ? h("p", {class: "legend", style: "color:var(--ink)"}, "Only the host and port are checked: a server is graded as a whole, so anything after the host in an address is ignored.") : "",
    h("div", {class: "scroll", tabindex: "0", role: "region", "aria-label": "Table, scrolls sideways"}, h("table", {}, h("thead", {}, h("tr", {}, ["Endpoint", "Grade", "Negotiated", "Certificate"].map((c) => h("th", {}, c)))), h("tbody", {}, rows))),
    h("p", {class: "legend"}, Object.entries(GRADES).map(([g, t]) => g + ": " + t).join(" · ")),
    proxyNote(last.endpoints),
    ...outlook(last.outlook),
    last.changes.length ? h("div", {class: "changed"}, h("h2", {}, "Changed since the scan before"), h("ul", {class: "list"}, last.changes.map((c) => h("li", {}, c.target + ": " + c.before + " → " + c.after)))) : "",
    h("div", {class: "row", style: "margin-top:20px"}, h("button", {class: "btn quiet", id: "export", onclick: exportCbom}, "Download CBOM"),
      h("button", {class: "btn quiet", onclick: () => exportCsv("endpoints/csv", {}, "endpoints.csv")}, "Download CSV"),
      h("button", {class: "btn quiet", onclick: () => print()}, "Print or save as PDF")),
    h("p", {class: "legend", id: "ep-export"}, "The CBOM (CycloneDX 1.6) is built from a fresh check of these endpoints."));
}
function outlook(o) {
  if (!o) return [];
  const item = (i) => h("li", {}, i.text, i.targets.length ? h("small", {}, i.targets.join(", ")) : "");
  return [o.risks.length ? h("section", {class: "outlook"}, h("h2", {}, "What can happen if nothing changes"), h("ul", {}, o.risks.map(item))) : "",
    o.actions.length ? h("section", {class: "outlook"}, h("h2", {}, "What we recommend"), h("ol", {}, o.actions.map(item))) : ""];
}
function proxyNote(rows) {
  const issuers = rows.map((r) => r.certificate && r.certificate.issuer).filter(Boolean);
  if (issuers.length < 2 || new Set(issuers).size !== 1 || new Set(rows.map((r) => r.target.split(":")[0])).size < 2) return "";
  return h("p", {class: "legend", style: "color:var(--ink)"}, "Every endpoint presented a certificate from the same issuer. That usually means a TLS-inspecting proxy answered for all of them, so these grades describe the proxy, not the servers. Check from a network without inspection.");
}
function save(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = h("a", {href: url, download: name}); document.body.append(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
async function exportCbom() {
  try {
    const r = await call("endpoints/cbom", {targets: state.endpoints.last.targets});
    save("endpoints-cbom.json", JSON.stringify(r.cbom, null, 2), "application/json");
    $("#ep-export").textContent = "Downloaded endpoints-cbom.json.";
  } catch (e) {}
}
async function exportCsv(path, body, name) { try { save(name, (await call(path, body)).csv, "text/csv"); } catch (e) {} }
const exports = (csv) => h("div", {class: "row", style: "margin-top:20px"}, h("button", {class: "btn quiet", onclick: csv}, "Download CSV"),
  h("button", {class: "btn quiet", onclick: () => print()}, "Print or save as PDF"));
function endpointsView() {
  const area = h("textarea", {id: "targets", placeholder: "api.example.com:443\nssh://bastion.example.com", spellcheck: "false"}, state.targets);
  state.restore = !state.targets;  // after a reload, the last check's hosts come back into the box
  const go = h("button", {class: "btn", id: "check"}, "Check endpoints");
  $("#panel").replaceChildren(h("h1", {}, "Are your endpoints ready?"),
    h("p", {class: "lede"}, "Grade live TLS and SSH servers on post-quantum key exchange, and see what changed since the last check."),
    h("label", {for: "targets", style: "margin-top:0"}, "Hosts to check (one per line)"), area,
    h("div", {class: "row", style: "margin-top:12px"}, go), h("p", {class: "state", id: "ep-state", role: "status"}), h("div", {id: "ep-result", class: "results", hidden: true}));
  go.addEventListener("click", async () => { state.targets = area.value; try { await call("endpoints/scan", {targets: area.value}); pollEndpoints(); } catch (e) {} });
  refreshEndpoints();
}
async function refreshEndpoints() {
  try {
    const e = await call("endpoints/status"); state.endpoints = e;
    const st = $("#ep-state"), b = $("#check");
    if (!st) return e;
    b.disabled = e.running; st.textContent = e.running ? "Checking endpoints…" : (e.error || ""); st.style.color = !e.running && e.error ? "var(--bad)" : "";
    if (state.restore && e.last) { state.restore = false; $("#targets").value = state.targets = e.last.targets.join("\n"); }
    $("#ep-result").hidden = !e.last;
    endpointResults(e); return e;
  } catch (e) { return null; }
}
function pollEndpoints() { clearInterval(state.timer); state.timer = setInterval(async () => { const e = await refreshEndpoints(); if (!e || !e.running) clearInterval(state.timer); }, 600); refreshEndpoints(); }

async function load() {
  try { state.status = await call("status"); state.selected = state.status.selected || 0; } catch (e) { return signedOut(); }
  shell();
  if (!state.status.configured && state.tab === "projects") $("#dir")?.focus();
}
acx.start().then((ok) => (ok ? load() : signedOut()));
</script>
</html>
