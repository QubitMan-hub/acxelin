<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acxelin Readiness</title>
<style>
/*SHELL*/
.split{grid-template-columns:minmax(0,230px) minmax(0,1fr)}
@media (max-width:780px){.split{grid-template-columns:minmax(0,1fr)}}
td.asset{font-family:var(--mono);font-size:13px}
details.track summary{white-space:nowrap;list-style:none}details.track summary::-webkit-details-marker{display:none}
details.track summary{text-decoration:underline;text-decoration-color:var(--rule-strong);text-underline-offset:3px}
details.where summary{cursor:pointer;list-style:none;font-family:var(--mono);font-size:13px}details.where summary::-webkit-details-marker{display:none}
details.where summary::after{content:" ▸";color:var(--muted)}details.where[open] summary::after{content:" ▾"}
details.where ul{margin:8px 0 2px;padding-left:16px;font:12.5px/1.6 var(--mono);color:var(--body)}details.where p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.counts button{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:center;border-radius:6px;padding:2px 4px}
.outlook{margin:24px 0 0}.outlook ul,.outlook ol{margin:8px 0 0;padding-left:20px;max-width:80ch}.outlook li{margin:0 0 10px}
.outlook li small{display:block;color:var(--muted);font:12.5px/1.6 var(--mono);overflow-wrap:anywhere}
.counts button:focus-visible{outline:2px solid var(--ink)}.counts button[aria-pressed="true"]{background:var(--select)}
</style>
</head>
<body>
<main>
<header class="brandbar"><div class="logo"><!--LOGO--></div><span class="product">Acxelin Readiness</span><small>Local console. Only this computer can open it.</small></header>
<p class="msg" id="msg" role="alert"></p>
<div id="app" aria-live="polite"><p class="lede">Opening the console…</p></div>
</main>
<script>
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, props = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, ""); else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const k of kids.flat()) el.append(k instanceof Node ? k : document.createTextNode(k ?? ""));
  return el;
};
const say = (text) => { const m = $("#msg"); m.textContent = text || ""; if (text) m.scrollIntoView({block: "center", behavior: "smooth"}); };
const state = {tab: "projects", status: null, projects: null, endpoints: null, selected: 0, timer: null, targets: "", filter: null};
const when = (t) => t ? new Date(t * 1000).toISOString().slice(0, 16).replace("T", " ") + " UTC" : "never";
const call = async (path, body) => { try { say(""); return await acx.api(path, body); } catch (e) { say(e.status === 401 ? "This session has ended. Run the console command again to open a new one." : e.message); throw e; } };

function signedOut() {
  $("#app").replaceChildren(h("div", {class: "narrow"}, h("h1", {}, "This link has expired"),
    h("p", {class: "lede"}, "Each launch link works once. In a terminal, run ", h("code", {class: "cmd"}, "acxelin-readiness console"), " to open a new one."),
    h("p", {class: "lede"}, "On a remote server, forward the port with SSH, then run ", h("code", {class: "cmd"}, "acxelin-readiness console link"), " in that session.")));
}

function setup() {
  const input = h("input", {type: "text", id: "dir", autocomplete: "off", placeholder: state.status.example, required: true});
  const go = async () => { try { await call("setup", {directory: input.value}); await load(); $("#tab-projects").focus(); } catch (e) {} };
  $("#panel").replaceChildren(h("div", {class: "narrow"}, h("h1", {}, "Where are your repositories?"),
    h("p", {class: "lede"}, "Acxelin Readiness only scans folders inside the one you choose here. Enter the full path of the folder that holds your repositories. To grade servers instead, open Endpoints; it needs no folder."),
    h("label", {for: "dir"}, "Folder path"), input,
    h("div", {class: "row", style: "margin-top:18px"}, h("button", {class: "btn", onclick: go}, "Use this folder")),
    h("h2", {style: "margin-top:32px"}, "Or scan a GitHub repository"), githubForm()));
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  input.focus();
}

async function addAndScan(project) {
  state.selected = project; state.filter = null;
  await call("projects/select", {project}); await load(); await call("projects/scan", {project}); pollProject();
}
function githubForm() {
  const url = h("input", {type: "url", id: "gh", autocomplete: "off", placeholder: "https://github.com/owner/repository"});
  const add = async () => { try { const r = await call("projects/github", {url: url.value}); await addAndScan(r.project); } catch (e) {} };
  url.addEventListener("keydown", (e) => { if (e.key === "Enter") add(); });
  const token = h("input", {type: "password", id: "ghtoken", autocomplete: "off"});
  const saveToken = async (value) => { try { await call("github/token", {token: value}); token.value = ""; await load(); } catch (e) {} };
  const saved = state.status.github_token;
  return h("div", {}, h("label", {for: "gh", style: "margin-top:0"}, "Add from GitHub"), url,
    h("div", {style: "margin-top:10px"}, h("button", {class: "btn quiet", onclick: add}, "Download and scan")),
    h("details", {class: "where", style: "margin-top:12px"}, h("summary", {}, saved ? "Private repositories: token saved" : "Private repositories"),
      h("p", {}, "A fine-grained token with read-only Contents access. It is kept on this computer, readable only by you, and sent only to api.github.com."),
      h("label", {for: "ghtoken"}, "Access token"), token,
      h("div", {class: "row", style: "margin-top:10px"}, h("button", {class: "btn quiet", onclick: () => saveToken(token.value)}, "Save token"),
        saved ? h("button", {class: "btn quiet", onclick: () => saveToken("")}, "Remove token") : "")));
}

function shell() {
  const tab = (id, label) => h("button", {role: "tab", id: "tab-" + id, "aria-selected": String(state.tab === id), "aria-controls": "panel", onclick: () => { clearInterval(state.timer); state.tab = id; shell(); }}, label);
  $("#app").replaceChildren(h("div", {class: "tabs", role: "tablist"}, tab("projects", "Projects"), tab("endpoints", "Endpoints")), h("div", {id: "panel", role: "tabpanel", "aria-labelledby": "tab-" + state.tab}));
  (state.tab === "projects" ? projectsView : endpointsView)();
}

// ---- projects

const tier = (t) => h("span", {class: "tag " + t}, t);
function trackForm(asset) {
  const t = asset.tracking || {}, id = asset.id.slice(0, 8);
  const owner = h("input", {type: "text", value: t.owner || "", id: "o" + id});
  const due = h("input", {type: "date", value: t.due || "", id: "d" + id});
  const status = h("select", {id: "s" + id}, [["open", "Open"], ["in_progress", "In progress"], ["exception", "Accepted risk"]].map(([v, l]) => h("option", {value: v, selected: (t.status || "open") === v}, l)));
  const reason = h("textarea", {id: "r" + id, rows: "2"}, t.reason || "");
  const until = h("input", {type: "date", value: t.until || "", id: "u" + id});
  const accept = h("div", {hidden: status.value !== "exception"}, h("label", {for: reason.id}, "Why it is accepted"), reason, h("label", {for: until.id}, "Accepted until"), until);
  status.addEventListener("change", () => { accept.hidden = status.value !== "exception"; });
  const save = async (ev) => { ev.preventDefault(); try { await call("projects/track", {project: state.selected, finding: asset.id, owner: owner.value, due: due.value, status: status.value, reason: reason.value, until: until.value}); await refreshProject(); } catch (e) {} };
  const label = t.status === "exception" ? "Accepted risk until " + t.until : t.owner ? "Owner: " + t.owner : "Assign an owner";
  return h("details", {class: "track"}, h("summary", {}, label),
    h("form", {onsubmit: save}, h("label", {for: owner.id}, "Owner"), owner, h("label", {for: due.id}, "Due date"), due, h("label", {for: status.id}, "Status"), status, accept, h("button", {class: "btn quiet", type: "submit"}, "Save")));
}
function where(a) {
  const shown = a.locations.slice(0, 50);
  return h("details", {class: "where"}, h("summary", {}, a.name),
    h("ul", {}, shown.map(([f, l]) => h("li", {}, f + ":" + l))),
    a.locations.length > shown.length ? h("p", {}, "and " + (a.locations.length - shown.length) + " more places") : "",
    a.why ? h("p", {}, a.why) : "", a.uncertainty ? h("p", {}, a.uncertainty) : "");
}

function results(p) {
  const out = $("#pj-result");
  if (!out) return;
  const last = p.last;
  if (!last) { out.replaceChildren(h("p", {class: "empty"}, p.running ? "The first scan of this repository is running. Results appear here when it finishes." : "Not scanned yet. Choose Scan repository to see which cryptography this project uses and what to migrate first.")); return; }
  const shown = JSON.stringify([last.finished, state.filter, last.assets.map((a) => a.tracking)]);
  if (out.dataset.shown === shown) return;  // polling during a scan must not close what the reader opened
  out.dataset.shown = shown;
  const shownAssets = last.assets.filter((a) => !a.test_only), tests = last.assets.length - shownAssets.length, pri = {};
  for (const a of shownAssets) pri[a.tier] = (pri[a.tier] || 0) + 1;
  const pick = (k) => { state.filter = state.filter === k ? null : k; results(state.projects); };
  const counts = h("div", {class: "counts"}, ["critical", "high", "medium", "low", "ok"].filter((k) => pri[k]).map((k) =>
    h("button", {"aria-pressed": String(state.filter === k), "aria-label": state.filter === k ? "Show every priority" : "Show only " + k, onclick: () => pick(k)}, tier(k), " ", String(pri[k]))));
  const assets = shownAssets.filter((a) => !state.filter || a.tier === state.filter);
  const rows = assets.map((a) => h("tr", {}, h("td", {class: "asset"}, where(a)), h("td", {}, tier(a.tier)), h("td", {}, a.action || a.why || ""), h("td", {class: "num"}, String(a.locations.length)), h("td", {}, trackForm(a))));
  out.replaceChildren(h("p", {class: "state"}, "Scanned " + when(last.finished) + ". " + shownAssets.length + " cryptographic assets found" + (tests ? ", and " + tests + " only in tests (not listed)." : ".")), counts,
    h("p", {class: "legend"}, "Choose an asset to see where it is. Choose a priority to show only those."),
    assets.length ? h("div", {class: "scroll", tabindex: "0", role: "region", "aria-label": "Table, scrolls sideways"}, h("table", {}, h("thead", {}, h("tr", {}, ["Asset", "Priority", "What to do", "Places", "Owner"].map((c) => h("th", {}, c)))), h("tbody", {}, rows))) : h("p", {class: "empty"}, "No cryptography was found in this repository."),
    last.notes && last.notes.length ? h("p", {class: "legend"}, last.notes.join(" ")) : "");
}

function projectsView() {
  const s = state.status, panel = $("#panel");
  if (!s.configured && !s.projects.length) return setup();
  const names = new Set(s.projects.map((p) => p.name)), addable = s.available.filter((n) => !names.has(n));
  const pick = h("select", {id: "add"}, addable.map((n) => h("option", {value: n}, n)));
  const add = async () => { try { const r = await call("projects/register", {name: pick.value}); await addAndScan(r.project); } catch (e) {} };
  const choose = async (id) => { try { await call("projects/select", {project: id}); state.selected = id; state.filter = null; projectsView(); } catch (e) {} };
  const side = h("div", {}, h("h2", {}, "Repositories"),
    s.projects.length ? h("ul", {class: "list"}, s.projects.map((p) => h("li", {}, h("button", {"aria-current": String(p.id === state.selected), onclick: () => choose(p.id)}, p.name)))) : h("p", {class: "state"}, "None added yet."),
    addable.length ? h("div", {}, h("label", {for: "add", style: "margin-top:0"}, "Add a repository"), pick, h("div", {style: "margin-top:10px"}, h("button", {class: "btn quiet", onclick: add}, "Add and scan")))
      : !s.configured ? "" : h("p", {class: "state"}, s.available.length ? "Every repository in " + s.directory + " is added." : "No repositories found in " + s.directory + ". Put one there, then reload."),
    h("div", {style: "margin-top:22px"}, githubForm()));
  const main = h("div", {id: "pj-main"});
  panel.replaceChildren(h("div", {class: "split"}, side, main));
  if (!s.projects.length) { main.replaceChildren(h("h1", {}, "Add your first repository"), h("p", {class: "empty"}, "Choose one under Add a repository. It is scanned straight away, to show which cryptography it uses and what to migrate first.")); return; }
  const button = h("button", {class: "btn", id: "scan"}, "Scan repository");
  main.replaceChildren(h("div", {class: "sectionhead"}, h("h1", {}, s.projects[state.selected].name), h("div", {class: "row"}, button)), h("p", {class: "state", id: "pj-state"}), h("div", {id: "pj-result"}));
  button.addEventListener("click", async () => {
    const running = state.projects && state.projects.running;
    try { await call(running ? "projects/cancel" : "projects/scan", running ? {} : {project: state.selected}); pollProject(); } catch (e) {}
  });
  refreshProject();
}

function paint(p) {
  state.projects = p;
  const b = $("#scan"), st = $("#pj-state");
  if (!b) return;
  b.textContent = p.running ? "Stop scan" : "Scan repository";
  b.classList.toggle("quiet", p.running);
  st.textContent = p.running ? (p.stage || "Scanning…") : (p.error || "");
  st.style.color = !p.running && p.error ? "var(--bad)" : "";
  results(p);
}
async function refreshProject() { try { const p = await call("projects/status"); paint(p); return p; } catch (e) { return null; } }
function pollProject() { clearInterval(state.timer); state.timer = setInterval(async () => { const p = await refreshProject(); if (!p || !p.running) clearInterval(state.timer); }, 600); refreshProject(); }

// ---- endpoints

const GRADES = {A: "post-quantum key exchange only", B: "post-quantum offered, classical still accepted", C: "classical only: traffic recorded today can be decrypted later", F: "unreachable, or no TLS at all"};
const GRADE_TONE = {A: "ok", B: "exposed", C: "bad", F: "mute"};
function endpointResults(e) {
  const out = $("#ep-result");
  if (!out) return;
  const last = e.last;
  if (!last) { out.replaceChildren(); return; }
  const rows = last.endpoints.map((r) => h("tr", {}, h("td", {}, r.target), h("td", {}, h("span", {class: "pill " + GRADE_TONE[r.grade]}, r.grade)), h("td", {}, r.negotiated || r.error || ""),
    h("td", {}, r.certificate ? (r.certificate.key || "") + (!r.certificate.expires ? "" : r.certificate.days_left < 0 ? " · expired " + r.certificate.expires : " · " + r.certificate.days_left + " days left") : "",
      r.certificate && r.certificate.issuer ? h("div", {class: "legend", style: "margin:2px 0 0"}, "issued by " + ((r.certificate.issuer.match(/CN=([^,]+)/) || [])[1] || r.certificate.issuer)) : "")));
  const pasted = (last.targets || []).some((t) => /^https?:\/\//i.test(t) || /^[^/]+\/./.test(t.replace(/^\w+:\/\//, "")));
  out.replaceChildren(h("p", {class: "state"}, "Checked " + when(last.finished) + ". " + last.summary.pq_key_exchange + " of " + last.summary.endpoints + " offer post-quantum key exchange."),
    pasted ? h("p", {class: "legend", style: "color:var(--ink)"}, "Only the host and port are checked: a server is graded as a whole, so anything after the host in an address is ignored.") : "",
    h("div", {class: "scroll", tabindex: "0", role: "region", "aria-label": "Table, scrolls sideways"}, h("table", {}, h("thead", {}, h("tr", {}, ["Endpoint", "Grade", "Negotiated", "Certificate"].map((c) => h("th", {}, c)))), h("tbody", {}, rows))),
    h("p", {class: "legend"}, Object.entries(GRADES).map(([g, t]) => g + ": " + t).join(" · ")),
    proxyNote(last.endpoints),
    ...outlook(last.outlook),
    last.changes.length ? h("div", {class: "changed"}, h("h2", {}, "Changed since the scan before"), h("ul", {class: "list"}, last.changes.map((c) => h("li", {}, c.target + ": " + c.before + " → " + c.after)))) : "",
    h("div", {class: "row", style: "margin-top:20px"}, h("button", {class: "btn quiet", id: "export", onclick: exportCbom}, "Download CBOM")),
    h("p", {class: "legend", id: "ep-export"}, "The CBOM (CycloneDX 1.6) is built from a fresh check of these endpoints."));
}
function outlook(o) {
  if (!o) return [];
  const item = (i) => h("li", {}, i.text, i.targets.length ? h("small", {}, i.targets.join(", ")) : "");
  return [o.risks.length ? h("section", {class: "outlook"}, h("h2", {}, "What can happen"), h("p", {class: "legend"}, "If nothing changes. Each point names the endpoints it applies to."), h("ul", {}, o.risks.map(item))) : "",
    o.actions.length ? h("section", {class: "outlook"}, h("h2", {}, "What we recommend"), h("p", {class: "legend"}, "Most urgent first."), h("ol", {}, o.actions.map(item))) : ""];
}
function proxyNote(rows) {
  const issuers = rows.map((r) => r.certificate && r.certificate.issuer).filter(Boolean);
  if (issuers.length < 2 || new Set(issuers).size !== 1 || new Set(rows.map((r) => r.target.split(":")[0])).size < 2) return "";
  return h("p", {class: "legend", style: "color:var(--ink)"}, "Every endpoint presented a certificate from the same issuer. That usually means a TLS-inspecting proxy answered for all of them, so these grades describe the proxy, not the servers. Check from a network without inspection.");
}
async function exportCbom() {
  try {
    const r = await call("endpoints/cbom", {targets: state.endpoints.last.targets});
    const url = URL.createObjectURL(new Blob([JSON.stringify(r.cbom, null, 2)], {type: "application/json"}));
    const a = h("a", {href: url, download: "endpoints-cbom.json"}); document.body.append(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    $("#ep-export").textContent = "Downloaded endpoints-cbom.json.";
  } catch (e) {}
}
function endpointsView() {
  const area = h("textarea", {id: "targets", placeholder: "api.example.com:443\nssh://bastion.example.com", spellcheck: "false"}, state.targets);
  const go = h("button", {class: "btn", id: "check"}, "Check endpoints");
  $("#panel").replaceChildren(h("h1", {}, "Are your endpoints ready?"),
    h("p", {class: "lede"}, "Grade live TLS and SSH servers on post-quantum key exchange, and see what changed since the last check."),
    h("label", {for: "targets", style: "margin-top:0"}, "Hosts to check (one per line)"), area,
    h("div", {class: "row", style: "margin-top:12px"}, go), h("p", {class: "state", id: "ep-state"}), h("div", {id: "ep-result"}));
  go.addEventListener("click", async () => { state.targets = area.value; try { await call("endpoints/scan", {targets: area.value}); pollEndpoints(); } catch (e) {} });
  refreshEndpoints();
}
async function refreshEndpoints() {
  try {
    const e = await call("endpoints/status"); state.endpoints = e;
    const st = $("#ep-state"), b = $("#check");
    if (!st) return e;
    b.disabled = e.running; st.textContent = e.running ? "Checking endpoints…" : (e.error || ""); st.style.color = !e.running && e.error ? "var(--bad)" : "";
    endpointResults(e); return e;
  } catch (e) { return null; }
}
function pollEndpoints() { clearInterval(state.timer); state.timer = setInterval(async () => { const e = await refreshEndpoints(); if (!e || !e.running) clearInterval(state.timer); }, 600); refreshEndpoints(); }

async function load() {
  try { state.status = await call("status"); state.selected = state.status.selected || 0; } catch (e) { return signedOut(); }
  shell();
  if (!state.status.configured && state.tab === "projects") $("#dir")?.focus();
}
acx.start().then((ok) => (ok ? load() : signedOut()));
</script>
</html>
