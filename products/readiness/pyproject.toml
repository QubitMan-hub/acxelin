[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acxelin-readiness"
version = "1.1.0"
description = "Acxelin Readiness: find the cryptography in code, configs, keys, binaries and live endpoints, write a CycloneDX 1.6 CBOM, and rank what to migrate first for post-quantum"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=43", "acxelin-core>=1.1,<2"]
authors = [{name = "Acxelin Quantum"}]
license = {file = "LICENSE"}
classifiers = ["License :: Other/Proprietary License", "Private :: Do Not Upload"]

[project.optional-dependencies]
crawler = ["tree-sitter>=0.25,<0.26", "tree-sitter-javascript>=0.23,<0.26", "tree-sitter-typescript>=0.23,<0.24", "tree-sitter-java>=0.23,<0.24",
           "tree-sitter-go>=0.23,<0.26"]
aws = ["boto3>=1.35"]
test = ["pytest>=9", "jsonschema>=4.18", "referencing>=0.30"]

[project.scripts]
acxelin-readiness = "acxelin_readiness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"acxelin_readiness" = ["assets/*", "console.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["corpus", ".*", "build", "dist", "*.egg", "venv", "node_modules"]
