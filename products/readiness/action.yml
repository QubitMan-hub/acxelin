name: Acxelin Readiness
description: Inventory the cryptography in a repository as a CycloneDX 1.6 CBOM and rank what to migrate for post-quantum
branding:
  icon: shield
  color: yellow
inputs:
  path:
    description: Folder to scan
    default: "."
  fail-on:
    description: Fail the step if any asset is at this tier or worse (critical, high, medium, low); empty never fails
    default: ""
  baseline:
    description: A previous cbom.json; with fail-on, only cryptography added since it fails the step
    default: ""
  args:
    description: Extra arguments for acxelin-readiness scan, such as --tls api.example.com:443 or --exclude generated
    default: ""
  output:
    description: Output folder
    default: readiness-out
  upload-sarif:
    description: Send findings to GitHub code scanning (needs security-events write permission)
    default: "true"
outputs:
  cbom:
    description: Path to cbom.json
    value: ${{ steps.scan.outputs.cbom }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14"
    - shell: bash
      run: pip install --quiet "$GITHUB_ACTION_PATH/../../core" "$GITHUB_ACTION_PATH"
    - id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
        BASELINE: ${{ inputs.baseline }}
        ARGS: ${{ inputs.args }}
        OUT: ${{ inputs.output }}
      run: |
        set +e -f  # -f: args such as --exclude *.min.js reach the scanner as written, not expanded against the workspace
        acxelin-readiness scan "$SCAN_PATH" -o "$OUT" ${FAIL_ON:+--fail-on "$FAIL_ON"} ${BASELINE:+--baseline "$BASELINE"} $ARGS
        code=$?
        echo "cbom=$OUT/cbom.json" >> "$GITHUB_OUTPUT"
        echo "code=$code" >> "$GITHUB_OUTPUT"
    - if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: ${{ inputs.output }}/readiness.sarif
        category: acxelin-readiness
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: acxelin-readiness
        path: ${{ inputs.output }}
        overwrite: true
    - shell: bash
      run: exit ${{ steps.scan.outputs.code }}
