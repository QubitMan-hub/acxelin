# Headquarters: waits for branches. Start with: acxelin-vpn up --config site-hq.toml
[site]
name = "hq.acme.example"              # must equal the CN of this site's certificate (acxelin-vpn ca issue site hq.acme.example --san 203.0.113.10)
address = "203.0.113.10"              # this gateway's public address
cert = "pki/issued/hq/chain.pem"
key = "pki/issued/hq/key.pem"
ca = "pki/ca.crt"
crl = "pki/crl.pem"                   # revoke a branch in the CA and its tunnel is cut within 15 seconds
# crl_url = "http://ca.internal:8080/crl.pem"   # when the CA runs elsewhere: fetched every crl_every (60) seconds into crl
vici = "unix:///var/run/charon.vici"
keyring_listen = "0.0.0.0:7443"       # branches agree keys here over ML-DSA mutual TLS
metrics = "127.0.0.1:9101"            # /metrics, /status

[[peer]]
name = "branch1.acme.example"
address = "198.51.100.7"
local_subnets = ["10.1.0.0/16"]
remote_subnets = ["10.2.0.0/16"]
profile = "standard"                  # X25519 + ML-KEM-768; "high" = P-384 + ML-KEM-1024; "cnsa2-rfc9370" = CNSA 2.0
rotate_minutes = 60
# outage_grace_minutes = 30             # off (0) by default. Keep this peer's tunnel up to 30 minutes past the normal limit (3 x rotate_minutes + 2 minutes)
#                                       # when key agreement stops, while the CRL is usable and does not list it. Hard cap, 0-1440; needs crl

# A partner's gateway that is not Acxelin VPN and cannot do hybrid ML-KEM (another vendor's IKEv2). Off unless set on that one peer.
# It offers hybrid ML-KEM first, then classical with the static PPK (RFC 8784) if the partner supports it, then plain classical.
# Anything below hybrid is NOT QUANTUM SAFE: logs, /status, metrics, the CBOM and the console say so. Keys are static files agreed
# with the partner (owner-only, 32+ bytes); there is no key agreement and no revocation by CRL for such a peer.
# [[peer]]
# name = "partner-gw.example.com"
# address = "203.0.113.50"
# local_subnets = ["10.1.0.0/16"]
# remote_subnets = ["10.50.0.0/16"]
# initiate = true
# classical_fallback = true
# fallback_psk_file = "/etc/acxelin-vpn/partner.psk"
# fallback_ppk_file = "/etc/acxelin-vpn/partner.ppk"   # optional
