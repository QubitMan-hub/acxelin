# Branch office: starts the tunnel and the key agreement.
[site]
name = "branch1.acme.example"
address = "198.51.100.7"
cert = "pki/issued/branch1/chain.pem"
key = "pki/issued/branch1/key.pem"
ca = "pki/ca.crt"
crl = "pki/crl.pem"
# crl_url = "http://ca.internal:8080/crl.pem"   # when the CA runs elsewhere: fetched every crl_every (60) seconds into crl
vici = "unix:///var/run/charon.vici"

[[peer]]
name = "hq.acme.example"
address = "203.0.113.10"
local_subnets = ["10.2.0.0/16"]
remote_subnets = ["10.1.0.0/16"]
initiate = true
keyring = "203.0.113.10:7443"
profile = "standard"
rotate_minutes = 60
# outage_grace_minutes = 30             # off (0) by default. Keep this peer's tunnel up to 30 minutes past the normal limit (3 x rotate_minutes + 2 minutes)
#                                       # when key agreement stops, while the CRL is usable and does not list it. Hard cap, 0-1440; needs crl
