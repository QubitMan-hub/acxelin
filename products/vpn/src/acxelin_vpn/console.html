<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acxelin VPN</title>
<style>
/*SHELL*/
.tunnel{border-top:1px solid var(--rule);padding:14px 0}
.tunnel h3{font:500 16px var(--display);margin:0 0 4px}
.tunnel dl.kv{grid-template-columns:9.5rem minmax(0,1fr)}.tunnel dl.kv dd{font-family:var(--mono);font-size:13px}
@media (max-width:860px){.split>:last-child{order:-1}}
</style>
</head>
<body>
<main>
<header class="brandbar"><div class="logo"><!--LOGO--></div><span class="product">Acxelin VPN</span><small>Local console. Only this computer can open it.</small></header>
<p class="msg" id="msg" role="alert"></p>
<div id="app" aria-live="polite"><p class="lede">Opening the console…</p></div>
</main>
<script>
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, props = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, ""); else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const k of kids.flat()) el.append(k instanceof Node ? k : document.createTextNode(k ?? ""));
  return el;
};
const say = (text) => { const m = $("#msg"); m.textContent = text || ""; if (text) m.scrollIntoView({block: "nearest"}); };
const state = {tab: "sites", status: null};
const call = async (path, body) => { try { say(""); return await acx.api(path, body); } catch (e) { say(e.status === 401 ? "This session has ended. Run the console command again to open a new one." : e.message); throw e; } };
const day = (t) => t ? t.slice(0, 10) : "";
const field = (id, label, input, hint) => [h("label", {for: id}, label), input, hint ? h("p", {class: "legend"}, ...acxText(hint)) : ""];

function signedOut() {
  $("#app").replaceChildren(h("div", {class: "narrow"}, h("h1", {}, "This link has expired"),
    h("p", {class: "lede"}, "Each launch link works once. In a terminal, run ", h("code", {class: "cmd"}, "acxelin-vpn console"), " to open a new one."),
    h("p", {class: "lede"}, "On a remote server, forward the port with SSH, then run ", h("code", {class: "cmd"}, "acxelin-vpn console link"), " in that session.")));
}

function noCa() {
  const name = h("input", {type: "text", id: "ca-name", autocomplete: "off", placeholder: "Example VPN Root"});
  const pass = h("input", {type: "password", id: "ca-pass", autocomplete: "new-password"});
  const again = h("input", {type: "password", id: "ca-pass2", autocomplete: "new-password"});
  const go = async () => {
    if (pass.value !== again.value) { say("The two passphrases are different. Type the same passphrase in both boxes."); again.select(); return; }
    try { await call("ca/create", {name: name.value, passphrase: pass.value || null}); await load(); } catch (e) {}
  };
  $("#app").replaceChildren(h("div", {class: "narrow"}, h("h1", {}, "Create the VPN's certificate authority"),
    h("p", {class: "lede"}, "Gateways, sites and people get their certificates from it. It is kept in " + state.status.ca_dir + "."),
    ...field("ca-name", "Name", name), ...field("ca-pass", "Passphrase (recommended)", pass, "Encrypts the CA key. The console keeps it in memory only, so you enter it again after a restart. Without one, the key file is stored unencrypted."),
    ...field("ca-pass2", "Repeat passphrase", again),
    h("div", {class: "row", style: "margin-top:18px"}, h("button", {class: "btn", onclick: go}, "Create certificate authority"))));
  name.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  name.focus();
}

function unlock() {
  const pass = h("input", {type: "password", id: "unlock-pass", autocomplete: "current-password"});
  const go = async () => { try { await call("ca/unlock", {passphrase: pass.value}); await load(); } catch (e) { pass.select(); } };
  $("#app").replaceChildren(h("div", {class: "narrow"}, h("h1", {}, "Unlock the certificate authority"),
    h("p", {class: "lede"}, "The CA key for " + state.status.name + " is encrypted. Enter its passphrase to invite and revoke people. The console keeps it in memory only."),
    ...field("unlock-pass", "Passphrase", pass), h("div", {class: "row", style: "margin-top:18px"}, h("button", {class: "btn", onclick: go}, "Unlock"))));
  pass.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  pass.focus();
}

function shell() {
  const tab = (id, label) => h("button", {role: "tab", id: "tab-" + id, "aria-selected": String(state.tab === id), "aria-controls": "panel", onclick: () => { state.tab = id; shell(); }}, label);
  $("#app").replaceChildren(h("div", {class: "tabs", role: "tablist"}, tab("sites", "Sites"), tab("people", "People"), tab("health", "Health")), h("div", {id: "panel", role: "tabpanel", "aria-labelledby": "tab-" + state.tab}));
  ({sites: sitesView, people: peopleView, health: healthView})[state.tab]();
}

const ago = (s) => s == null ? "never" : s < 90 ? s + " s ago" : s < 5400 ? Math.round(s / 60) + " min ago" : Math.round(s / 3600) + " h ago";
const when = (t) => t ? new Date(t * 1000).toISOString().slice(0, 16).replace("T", " ") + " UTC" : "";
const pill = (tone, text) => h("span", {class: "pill " + tone}, text);
const kv = (pairs) => h("dl", {class: "kv"}, pairs.filter(([, v]) => v != null && v !== "").flatMap(([k, v]) => [h("dt", {}, k), h("dd", {}, v)]));

function serviceForm(kind, label, hint, after) {
  const name = h("input", {type: "text", id: kind + "-name", autocomplete: "off", placeholder: kind === "site" ? "Headquarters" : "Remote access"});
  const url = h("input", {type: "text", id: kind + "-url", autocomplete: "off", placeholder: "http://127.0.0.1:9101"});
  const add = async () => { try { await call("services/add", {kind, name: name.value, url: url.value}); name.value = url.value = ""; await after(); } catch (e) {} };
  return h("div", {}, h("h2", {}, label), h("p", {class: "lede"}, ...acxText(hint)), ...field(kind + "-name", "Name", name), ...field(kind + "-url", "Status address", url),
    h("div", {class: "row", style: "margin-top:12px"}, h("button", {class: "btn", onclick: add}, label)));
}
const removeButton = (name, after) => h("button", {class: "btn quiet small", "aria-label": "Remove " + name, onclick: async () => { try { await call("services/remove", {name}); await after(); } catch (e) {} }}, "Remove");

// ---- sites

async function sitesView() {
  $("#panel").replaceChildren(h("h1", {}, "Sites"), h("div", {class: "split"},
    serviceForm("site", "Add a site", "The status address of a gateway running `acxelin-vpn up` with `metrics = \"HOST:PORT\"` in its `[site]`.", paintSites),
    h("div", {id: "site-list"})));
  await paintSites();
}
async function paintSites() {
  const out = $("#site-list");
  if (!out) return;
  let d; try { d = await call("sites"); } catch (e) { return; }
  if (!d.sites.length) return out.replaceChildren(h("p", {class: "empty"}, "No sites added yet. Each site's tunnels, algorithms, key rotation and peer certificates appear here."));
  out.replaceChildren(...d.sites.map((s) => h("section", {class: "tunnel"}, h("div", {class: "row", style: "justify-content:space-between"}, h("h3", {}, s.name), removeButton(s.name, paintSites)),
    s.error ? h("p", {class: "bad"}, s.error) : s.tunnels.length ? h("div", {}, ...s.tunnels.map((t) => h("div", {style: "margin:10px 0 16px"},
      h("p", {style: "margin:0 0 6px"}, h("strong", {}, t.peer), " ", t.protected ? pill("ok", "Protected") : pill("bad", t.state === "no tunnel" ? "No tunnel" : "Not protected")),
      kv([["Key exchange", t.key_exchange], ["Encryption", t.encryption], ["Post-quantum PPK", t.ppk == null ? null : t.ppk ? "yes" : "no"],
          ["Last key rotation", ago(t.last_rotation_s)], ["Traffic", t.protected ? t.bytes_in + " B in, " + t.bytes_out + " B out" : null],
          ["Peer certificate", t.certificate ? t.certificate.common_name + " · " + t.certificate.status + " · until " + day(t.certificate.not_after) : "not seen yet"]]))))
      : h("p", {class: "empty"}, "This site reports no peers."))));
}

// ---- people

async function peopleView() {
  const s = state.status.settings || {};
  const enroll = h("input", {type: "text", id: "enroll", value: s.enroll || "", placeholder: "https://ca.example.com:9443", autocomplete: "off"});
  const gateway = h("input", {type: "text", id: "gateway", value: s.gateway || "", placeholder: "vpn.example.com:7443", autocomplete: "off"});
  const sname = h("input", {type: "text", id: "server-name", value: s.server_name || "", placeholder: "vpn.example.com", autocomplete: "off"});
  const save = async () => { try { await call("people/settings", {enroll: enroll.value, gateway: gateway.value, server_name: sname.value || null}); state.status = await call("status"); say(""); $("#saved").textContent = "Saved."; } catch (e) {} };
  const ready = s.enroll && s.gateway;
  const where = () => [...field("enroll", "Enrollment service", enroll, "Where `acxelin-vpn ca serve` runs."), ...field("gateway", "Gateway key agreement address", gateway),
    ...field("server-name", "Gateway certificate name (if different from its host)", sname),
    h("div", {class: "row", style: "margin-top:12px"}, h("button", {class: "btn quiet", onclick: save}, "Save"), h("span", {id: "saved", class: "ok-msg", role: "status"}))];
  const who = h("input", {type: "text", id: "who", autocomplete: "off", placeholder: "alice"});
  const hours = h("input", {type: "text", id: "hours", value: "24", inputmode: "numeric"});
  const invite = async (ev) => {
    ev.preventDefault();
    try { const f = await acx.download("people/invite", {name: who.value, hours: Number(hours.value)}); say(""); $("#invited").replaceChildren(h("p", {class: "ok-msg"}, "Downloaded " + f + ". Send it to " + who.value + " through a channel you trust; it works once.")); who.value = ""; await paintPeople(); }
    catch (e) { say(e.status === 401 ? "This session has ended. Run the console command again to open a new one." : e.message); }
  };
  $("#panel").replaceChildren(h("h1", {}, "People"), h("div", {class: "split"},
    h("div", {}, ready ? "" : h("section", {style: "margin-bottom:24px"}, h("h2", {}, "First, say where invitations point"),
        h("p", {class: "lede"}, "An invitation tells the person's computer where to enroll and which gateway to reach. Set this once."), ...where()),
      h("form", {onsubmit: invite}, h("h2", {}, "Invite someone"), ...field("who", "Their name", who, "The name on their certificate. If the gateway lists users, add it there too."),
        ...field("hours", "Valid for (hours)", hours), h("div", {class: "row", style: "margin-top:14px"}, h("button", {class: "btn", type: "submit"}, "Download invitation")), h("div", {id: "invited", "aria-live": "polite"})),
      ready ? h("details", {style: "margin-top:24px"}, h("summary", {}, "Where invitations point"), ...where()) : "",
      h("div", {style: "margin-top:24px"}, serviceForm("gateway", "Add a gateway", "The status address of `acxelin-vpn gateway` with `metrics = \"HOST:PORT\"` in its `[wireguard]`.", paintPeople))),
    h("div", {id: "people-list"})));
  await paintPeople();
}
const ACTIONS = {create: "Created the certificate authority", invite: "Invited", revoke: "Revoked", enroll: "Enrolled", renew: "Renewed", "enrollment refused": "Refused an enrollment for",
  connected: "Connected:", "new device": "New device for", refused: "Refused", "revoked, removed": "Cut off (revoked):", disconnected: "Disconnected:"};
const bytes = (n) => n == null ? "" : n < 1e3 ? n + " B" : n < 1e6 ? (n / 1e3).toFixed(1) + " kB" : n < 1e9 ? (n / 1e6).toFixed(1) + " MB" : (n / 1e9).toFixed(2) + " GB";
const span = (s) => s == null ? "" : s < 120 ? s + " s" : s < 7200 ? Math.round(s / 60) + " min" : s < 172800 ? Math.round(s / 3600) + " h" : Math.round(s / 86400) + " days";
async function paintPeople() {
  const out = $("#people-list");
  if (!out) return;
  let d; try { d = await call("people"); } catch (e) { return; }
  const rows = d.people.map((p) => h("tr", {}, h("td", {}, p.name),
    h("td", {}, p.connected ? pill("ok", "Connected") : p.agreed ? pill("warn", "Keys agreed, no handshake") : pill("mute", "Not connected")),
    h("td", {class: "num"}, p.connected ? when(p.since) : ""),
    h("td", {class: "num"}, p.agreed ? "↓ " + bytes(p.bytes_in) + " ↑ " + bytes(p.bytes_out) : ""),
    h("td", {class: "num", title: p.handshake_age_s == null ? "" : "last WireGuard handshake " + span(p.handshake_age_s) + " ago"}, p.key_age_s == null ? "" : span(p.key_age_s) + " ago"),
    h("td", {}, p.address || ""),
    h("td", {}, p.certificate === "valid" ? pill("ok", "Valid") : p.certificate === "revoked" ? pill("bad", "Revoked") : pill("mute", "Unknown")),
    h("td", {}, p.certificate === "valid" ? revokeButton(p) : "")));
  out.replaceChildren(d.gateways.length ? h("p", {class: "legend", style: "margin:0 0 12px"}, d.gateways.map((g) => g.error ? g.name + ": not answering. " : g.name + (g.up_s == null ? "" : ": up " + span(g.up_s)) + ". "))
      : h("p", {class: "legend", style: "margin:0 0 12px"}, "Who is connected now shows once you add a gateway."),
    d.people.length ? h("div", {class: "scroll", tabindex: "0", role: "region", "aria-label": "People, scrolls sideways"}, h("table", {}, h("thead", {}, h("tr", {}, ["Person", "Now", "Since", "Traffic", "Key renewed", "Address", "Certificate", "Action"].map((c) => h("th", {}, c)))), h("tbody", {}, rows)))
      : h("p", {class: "empty"}, "Nobody yet. Use Invite someone to add the first person."),
    h("h2", {style: "margin-top:26px"}, "Recent activity"),
    d.activity.length ? h("ul", {class: "acts"}, d.activity.map((a) => h("li", {}, h("span", {class: "mute"}, (a.time || "").replace("T", " ").replace("Z", " UTC")), " ",
      (ACTIONS[a.action] || a.action) + " " + (a.name || "") + (a.reason ? " (" + a.reason + ")" : "") + (a.gateway ? " · " + a.gateway : ""))))
      : h("p", {class: "empty"}, "Nothing yet."));
}
function revokeButton(p) {
  const b = h("button", {class: "btn quiet small", "aria-label": "Revoke " + p.name}, "Revoke");
  let armed = false, timer;
  b.addEventListener("click", async () => {
    const set = (text) => { b.textContent = text; b.setAttribute("aria-label", text + " " + p.name); b.className = "btn small " + (armed ? "danger" : "quiet"); };
    if (!armed) { armed = true; set("Confirm revoke"); timer = setTimeout(() => { armed = false; set("Revoke"); }, 6000); return; }
    clearTimeout(timer);
    try { await call("people/revoke", {name: p.name}); say(""); await paintPeople(); watchEnd(p.name); } catch (e) { armed = false; set("Revoke"); }
  });
  return b;
}
function watchEnd(name) {
  let n = 0;
  const t = setInterval(async () => { n += 1; if (state.tab !== "people" || n > 30) return clearInterval(t); await paintPeople(); }, 5000);
}

// ---- health

async function healthView() {
  const out = h("div", {id: "health-list"});
  const run = async () => {
    let d; try { d = await call("health"); } catch (e) { return; }
    const tone = {ok: "ok", warn: "warn", fail: "bad"}, label = {ok: "OK", warn: "Warning", fail: "Problem"};
    const acts = d.checks.some((c) => c.action);
    out.replaceChildren(h("div", {class: "scroll", tabindex: "0", role: "region", "aria-label": "Checks, scrolls sideways"}, h("table", {}, h("thead", {}, h("tr", {}, ["Result", "Check", ...(acts ? ["What to do"] : [])].map((c) => h("th", {}, c)))),
      h("tbody", {}, d.checks.map((c) => h("tr", {}, h("td", {}, pill(tone[c.level], label[c.level])), h("td", {}, ...acxText(c.message)), acts ? h("td", {}, ...acxText(c.action)) : ""))))));
  };
  $("#panel").replaceChildren(h("h1", {}, "Health"), h("p", {class: "lede"}, "Whether this computer can run Acxelin VPN, whether the certificate authority is in good shape, and whether every site and gateway answers."),
    h("div", {class: "row", style: "margin-bottom:18px"}, h("button", {class: "btn quiet", id: "recheck", onclick: run}, "Check again")), out);
  await run();
}

async function load() {
  try { state.status = await call("status"); } catch (e) { return signedOut(); }
  if (!state.status.configured) return noCa();
  if (state.status.encrypted && !state.status.unlocked) return unlock();
  shell();
}
acx.start().then((ok) => (ok ? load() : signedOut()));
</script>
</html>
